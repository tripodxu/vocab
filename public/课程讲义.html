<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>核心词汇 · 课程讲义</title>
    <meta name="description" content="词汇讲义：词根词源、例句、备注与配图，支持批注与云端同步。" />
    <meta name="theme-color" content="#eef0f7" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="ui.css" />
    <link rel="stylesheet" href="lecture.css" />
  </head>
  <body>
    <div class="app-bg" aria-hidden="true"></div>

    <div class="layout">
      <header class="topbar">
        <div class="topbar-inner">
          <div class="brand">
            <span class="brand-mark" aria-hidden="true">L</span>
            <span class="brand-text">
              <b>课程讲义</b>
              <small id="lectureSub">加载中…</small>
            </span>
          </div>
          <a class="btn btn-icon btn-ghost" id="practiceLink" href="index.html" title="去刷词练习" aria-label="去刷词练习">✏️</a>
          <button class="btn btn-icon btn-ghost" id="menuBtn" type="button" title="设置" aria-label="设置">☰</button>
        </div>
      </header>

      <div class="panel-title">
        <div class="lecture-title">
          <h1 id="lectureTitle">📘 核心词汇</h1>
        </div>
        <div class="row">
          <button class="btn btn-icon" id="prevChapter" type="button" title="上一章" aria-label="上一章">‹</button>
          <button class="btn btn-icon" id="nextChapter" type="button" title="下一章" aria-label="下一章">›</button>
        </div>
      </div>

      <div class="toolbar">
        <button class="btn chapter-btn" id="chapterBtn" type="button" aria-label="选择章节">📚 选择章节</button>
        <div class="search">
          <input class="input" id="searchInput" type="search" placeholder="搜索单词、释义或词根…" aria-label="搜索词汇" />
        </div>
      </div>

      <div class="filters" id="filters" role="group" aria-label="筛选">
        <button class="filter-chip" type="button" data-filter="all" aria-pressed="true">全部</button>
        <button class="filter-chip" type="button" data-filter="核心" aria-pressed="false"><span class="tag-dot" style="background:var(--bad)"></span>核心</button>
        <button class="filter-chip" type="button" data-filter="高频" aria-pressed="false"><span class="tag-dot" style="background:var(--warn)"></span>高频</button>
        <button class="filter-chip" type="button" data-filter="低频" aria-pressed="false"><span class="tag-dot" style="background:var(--text-3)"></span>低频</button>
        <button class="filter-chip" type="button" data-filter="识记" aria-pressed="false"><span class="tag-dot" style="background:var(--ok)"></span>识记</button>
        <button class="filter-chip" type="button" data-filter="note" aria-pressed="false">📝 有笔记</button>
        <button class="filter-chip" type="button" data-filter="star" aria-pressed="false">★ 生词</button>
      </div>

      <div class="loading-card" id="loadingCard" hidden>
        <span class="spinner" aria-hidden="true"></span>
        <span>正在加载词库…</span>
      </div>

      <div class="stack" id="errorCard" hidden>
        <p class="feedback bad" id="errorText"></p>
        <button class="btn" id="retryBtn" type="button">重试</button>
      </div>

      <div class="grid" id="grid" aria-live="polite"></div>

      <p class="footnote">
        点卡片看详情 / 写备注 / 加配图 · 详情里点「✏️ 练这个词」跳到刷词页 · <kbd>←</kbd><kbd>→</kbd> 切换单词 · <kbd>空格</kbd> 朗读 ·
        <kbd>Esc</kbd> 关闭
      </p>
    </div>

    <canvas id="globalCanvas" aria-hidden="true"></canvas>
    <button class="btn btn-icon" id="brushToggle" type="button" title="整页画笔标注" aria-label="整页画笔标注" style="position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:70">🖌️</button>
    <div class="brush-bar" id="brushBar">
      <input type="color" id="brushColor" value="#e5484d" title="画笔颜色" aria-label="画笔颜色" />
      <button class="btn btn-sm" id="brushClear" type="button">🗑️ 清除</button>
      <button class="btn btn-sm" id="brushClose" type="button">✕ 退出画笔</button>
    </div>

    <script type="module" src="lecture.js"></script>
  </body>
</html>

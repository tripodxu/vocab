<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自然地理 · 核心词汇</title>
    <script src="vocab-auth.js"></script>
    <script>window.VOCAB_API_BASE = '';</script>
    <style>
        /* ===================== CSS Variables ===================== */
        :root {
            --primary: #0f172a;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --accent-soft: rgba(99,102,241,.10);
            --accent-glow: rgba(99,102,241,.25);
            --bg: #f8fafc;
            --bg-subtle: #f1f5f9;
            --card-bg: rgba(255,255,255,.80);
            --card-bg-solid: #ffffff;
            --text: #0f172a;
            --text-secondary: #64748b;
            --text-muted: #94a3b8;
            --border: rgba(226,232,240,.70);
            --border-strong: #e2e8f0;
            --track: #f1f5f9;
            --track-hover: #e2e8f0;
            --shadow-sm: 0 1px 2px rgba(0,0,0,.04);
            --shadow: 0 1px 3px rgba(0,0,0,.06), 0 4px 16px rgba(0,0,0,.06);
            --shadow-lg: 0 4px 24px rgba(0,0,0,.08), 0 12px 40px rgba(0,0,0,.06);
            --shadow-xl: 0 8px 40px rgba(0,0,0,.10), 0 20px 60px rgba(0,0,0,.08);
            --radius-sm: 10px;
            --radius: 16px;
            --radius-lg: 20px;
            --radius-xl: 24px;
            --transition: all 0.2s cubic-bezier(.4,0,.2,1);
            --transition-fast: all 0.12s cubic-bezier(.4,0,.2,1);
            --tag-core: #ef4444;
            --tag-high: #f59e0b;
            --tag-low: #94a3b8;
            --tag-recog: #10b981;
            --tag-core-bg: rgba(239,68,68,.12);
            --tag-high-bg: rgba(245,158,11,.12);
            --tag-low-bg: rgba(148,163,184,.12);
            --tag-recog-bg: rgba(16,185,129,.12);
            --glass-bg: rgba(255,255,255,.60);
            --glass-border: rgba(255,255,255,.30);
            --glass-blur: 20px;
            --overlay-in: overlayIn 0.28s cubic-bezier(.16,1,.3,1) forwards;
            --overlay-out: overlayOut 0.2s cubic-bezier(.4,0,1,1) forwards;
        }

        /* ===================== Reset ===================== */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, 'Segoe UI', 'HarmonyOS Sans SC', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            transition: background 0.4s ease, color 0.4s ease;
        }

        /* ===================== Scrollbar ===================== */
        .main::-webkit-scrollbar, .sidebar::-webkit-scrollbar, .overlay-scroll::-webkit-scrollbar { width: 6px; }
        .main::-webkit-scrollbar-track, .sidebar::-webkit-scrollbar-track, .overlay-scroll::-webkit-scrollbar-track { background: transparent; }
        .main::-webkit-scrollbar-thumb, .sidebar::-webkit-scrollbar-thumb, .overlay-scroll::-webkit-scrollbar-thumb {
            background: rgba(0,0,0,.10); border-radius: 99px;
        }
        .main::-webkit-scrollbar-thumb:hover, .sidebar::-webkit-scrollbar-thumb:hover, .overlay-scroll::-webkit-scrollbar-thumb:hover {
            background: rgba(0,0,0,.18);
        }
        .main, .sidebar, .overlay-scroll { scrollbar-width: thin; scrollbar-color: rgba(0,0,0,.10) transparent; }

        /* ===================== Sidebar ===================== */
        .sidebar {
            width: 240px;
            background: var(--glass-bg);
            backdrop-filter: blur(var(--glass-blur));
            -webkit-backdrop-filter: blur(var(--glass-blur));
            border-right: 1px solid var(--border);
            padding: 20px 12px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            z-index: 10;
            overflow-y: auto;
            flex-shrink: 0;
            transition: background 0.4s ease, border-color 0.4s ease;
        }
        .sidebar h2 {
            font-size: 0.72rem;
            color: var(--text-muted);
            margin-bottom: 12px;
            flex-shrink: 0;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            padding: 0 8px;
        }
        .sidebar button {
            border: 1px solid transparent;
            background: transparent;
            padding: 8px 14px;
            border-radius: 99px;
            text-align: left;
            font-size: 0.84rem;
            cursor: pointer;
            transition: var(--transition);
            color: var(--text-secondary);
            flex-shrink: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-family: inherit;
            font-weight: 500;
            position: relative;
        }
        .sidebar button:hover {
            background: var(--track);
            color: var(--text);
        }
        .sidebar button.active {
            background: var(--accent);
            color: #ffffff;
            font-weight: 600;
            border-color: transparent;
            box-shadow: 0 2px 8px rgba(99,102,241,.30);
        }

        /* ===================== Main ===================== */
        .main {
            flex: 1;
            padding: 32px;
            overflow-y: auto;
            position: relative;
            background:
                radial-gradient(ellipse 800px 500px at 80% -5%, rgba(99,102,241,.08), transparent 60%),
                radial-gradient(ellipse 600px 400px at 10% 100%, rgba(16,185,129,.05), transparent 50%),
                var(--bg);
            transition: background 0.4s ease;
        }
        .main h1 {
            font-size: 1.65rem;
            color: var(--primary);
            margin-bottom: 8px;
            font-weight: 800;
            letter-spacing: -0.025em;
        }
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 14px;
            margin-top: 20px;
        }

        /* ===================== Cards ===================== */
        .card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
            padding: 20px 16px 16px;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            position: relative;
            overflow: hidden;
            opacity: 0;
            transform: translateY(16px);
            animation: cardStaggerIn 0.45s cubic-bezier(.16,1,.3,1) forwards;
        }
        @keyframes cardStaggerIn {
            from { opacity: 0; transform: translateY(16px) scale(0.97); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .card::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: var(--radius-lg);
            background: linear-gradient(135deg, rgba(99,102,241,.03), transparent 60%);
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }
        .card:hover {
            box-shadow: var(--shadow-lg);
            transform: translateY(-6px);
            border-color: rgba(99,102,241,.25);
        }
        .card:hover::before { opacity: 1; }
        .card .word {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 3px;
            word-break: break-word;
            letter-spacing: -0.025em;
            line-height: 1.2;
        }
        .card .phonetic {
            font-size: 0.78rem;
            color: var(--text-muted);
            margin-bottom: 10px;
            font-weight: 400;
        }
        .card .pos {
            font-size: 0.7rem;
            background: var(--accent-soft);
            color: var(--accent);
            padding: 3px 12px;
            border-radius: 99px;
            margin-bottom: 6px;
            font-weight: 600;
            letter-spacing: 0.01em;
        }
        .card .tag {
            font-size: 0.68rem;
            padding: 3px 11px;
            border-radius: 99px;
            font-weight: 700;
            margin-bottom: 10px;
            letter-spacing: 0.02em;
        }
        .tag-core { background: var(--tag-core-bg); color: var(--tag-core); }
        .tag-high { background: var(--tag-high-bg); color: var(--tag-high); }
        .tag-low { background: var(--tag-low-bg); color: var(--tag-low); }
        .tag-recog { background: var(--tag-recog-bg); color: var(--tag-recog); }

        .card .meaning {
            font-size: 0.86rem;
            color: var(--text-secondary);
            font-weight: 500;
            margin-bottom: 14px;
            line-height: 1.5;
        }
        .card .card-actions {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-top: auto;
        }
        .btn-icon {
            border: 1px solid var(--border);
            background: var(--track);
            cursor: pointer;
            font-size: 0.95rem;
            padding: 6px 10px;
            border-radius: var(--radius-sm);
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
            color: var(--text-secondary);
        }
        .btn-icon:hover {
            background: var(--accent-soft);
            border-color: var(--accent-glow);
            color: var(--accent);
        }

        /* Upload button: hidden by default, show on card hover */
        .upload-icon-sm {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-muted);
            transition: var(--transition);
            background: var(--card-bg-solid);
            border: 1px solid var(--border);
            cursor: pointer;
            line-height: 1;
            width: 28px;
            height: 28px;
            padding: 0;
            border-radius: 99px;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transform: scale(0.8);
            box-shadow: var(--shadow-sm);
        }
        .card:hover .upload-icon-sm {
            opacity: 1;
            transform: scale(1);
        }
        .upload-icon-sm:hover {
            color: var(--accent);
            background: var(--accent-soft);
            border-color: var(--accent-glow);
        }

        /* ===================== Overlay ===================== */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15,23,42,.55);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 1000;
            display: none;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.25s ease;
        }
        .overlay.active {
            display: flex;
            opacity: 1;
            animation: overlayFadeIn 0.25s ease forwards;
        }
        @keyframes overlayFadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes overlayContentIn {
            from { opacity: 0; transform: scale(0.94) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        .overlay-content {
            background: var(--card-bg-solid);
            backdrop-filter: blur(var(--glass-blur));
            -webkit-backdrop-filter: blur(var(--glass-blur));
            border-radius: var(--radius-xl);
            box-shadow: 0 32px 80px rgba(0,0,0,.20), 0 0 0 1px rgba(255,255,255,.06) inset;
            border: 1px solid var(--border);
            width: 960px;
            max-width: 92vw;
            aspect-ratio: 16 / 9;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            animation: overlayContentIn 0.3s cubic-bezier(.16,1,.3,1) forwards;
            transition: background 0.4s ease, border-color 0.4s ease;
        }
        .overlay-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 32px 32px 12px 32px;
        }
        .overlay-note-area {
            padding: 12px 32px 20px 32px;
            border-top: 1px solid var(--border);
            background: var(--track);
            flex-shrink: 0;
            transition: background 0.4s ease;
        }

        /* Word header */
        .word-main {
            display: flex;
            align-items: baseline;
            gap: 14px;
            margin-bottom: 14px;
        }
        .word-main h2 {
            font-size: 2.2rem;
            letter-spacing: -0.03em;
            font-weight: 800;
            background: linear-gradient(135deg, var(--accent), #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .word-main .phonetic {
            font-size: 1.05rem;
            color: var(--text-muted);
            font-weight: 400;
        }
        .pos-badge {
            display: inline-block;
            background: var(--accent-soft);
            padding: 5px 16px;
            border-radius: 99px;
            font-size: 0.85rem;
            color: var(--accent);
            font-weight: 600;
            width: fit-content;
            margin-bottom: 14px;
            vertical-align: middle;
        }
        .tag-badge {
            display: inline-block;
            padding: 5px 16px;
            border-radius: 99px;
            font-size: 0.85rem;
            font-weight: 700;
            vertical-align: middle;
        }
        .meaning-large {
            font-size: 1.2rem;
            color: var(--text);
            font-weight: 600;
            margin-bottom: 14px;
            line-height: 1.5;
        }

        /* Example box */
        .example-box {
            background: var(--accent-soft);
            border: 1px solid rgba(99,102,241,.12);
            border-left: 3px solid var(--accent);
            padding: 16px 20px;
            border-radius: var(--radius);
            font-style: italic;
            color: var(--text);
            margin-bottom: 14px;
            line-height: 1.65;
            position: relative;
        }
        .example-box::before {
            content: '"';
            position: absolute;
            top: -4px;
            left: 10px;
            font-size: 2.8rem;
            color: var(--accent);
            opacity: 0.2;
            font-style: normal;
            line-height: 1;
        }
        .example-box .cn {
            font-style: normal;
            color: var(--text-secondary);
            font-size: 0.88rem;
            display: block;
            margin-top: 6px;
            padding-top: 6px;
            border-top: 1px solid var(--border);
        }

        /* Root box */
        .root-box {
            background: linear-gradient(135deg, #fef9ee, #fef3c7);
            border: 1px solid #fde68a;
            padding: 14px 20px;
            border-radius: var(--radius);
            font-size: 0.92rem;
            color: #92400e;
            margin-bottom: 14px;
            line-height: 1.6;
            position: relative;
        }
        .root-box::before {
            margin-right: 2px;
        }

        .extra-box {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 14px;
            line-height: 1.65;
        }
        .image-preview img {
            max-width: 100%;
            border-radius: var(--radius);
            margin-top: 12px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
        }

        /* Close button */
        .close-btn {
            position: absolute;
            top: 16px;
            right: 20px;
            font-size: 1.2rem;
            background: var(--track);
            border: 1px solid var(--border);
            cursor: pointer;
            color: var(--text-secondary);
            z-index: 20;
            width: 36px;
            height: 36px;
            border-radius: 99px;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }
        .close-btn:hover {
            background: rgba(239,68,68,.10);
            border-color: rgba(239,68,68,.25);
            color: #ef4444;
        }

        /* Lecture note */
        .lecture-note {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--primary);
            min-height: 44px;
            resize: none;
            font-family: inherit;
            outline: none;
            overflow: hidden;
            line-height: 1.45;
            background: var(--card-bg-solid);
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }
        .lecture-note:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        /* ===================== Canvas & Brush ===================== */
        #globalCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10000;
            display: none;
            cursor: crosshair;
            touch-action: none;
        }

        /* Top bar */
        .top-bar {
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 1004;
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--glass-bg);
            backdrop-filter: blur(var(--glass-blur));
            -webkit-backdrop-filter: blur(var(--glass-blur));
            border: 1px solid var(--border);
            border-radius: 99px;
            padding: 6px 8px;
            box-shadow: var(--shadow);
            transition: background 0.4s ease, border-color 0.4s ease;
        }
        .top-bar a, .top-bar button { flex-shrink: 0; }
        .top-bar a {
            padding: 6px 14px !important;
            border-radius: 99px !important;
            border: 1px solid var(--border) !important;
            background: var(--card-bg-solid) !important;
            color: var(--text-secondary) !important;
            font-weight: 500 !important;
            transition: var(--transition) !important;
        }
        .top-bar a:hover {
            color: var(--text) !important;
            background: var(--accent-soft) !important;
            border-color: var(--accent-glow) !important;
        }
        .top-bar #loginBtn,
        .top-bar #logoutBtn {
            padding: 6px 16px;
            border-radius: 99px;
            font-size: 0.8rem;
            border: 1px solid var(--border);
            background: var(--accent);
            color: #ffffff;
            cursor: pointer;
            transition: var(--transition);
            font-weight: 600;
            font-family: inherit;
        }
        .top-bar #loginBtn:hover,
        .top-bar #logoutBtn:hover {
            background: var(--accent-hover);
            box-shadow: 0 2px 8px var(--accent-glow);
        }
        .top-bar #logoutBtn {
            background: transparent;
            color: var(--text-secondary);
        }
        .top-bar #logoutBtn:hover {
            background: rgba(239,68,68,.10);
            border-color: rgba(239,68,68,.25);
            color: #ef4444;
            box-shadow: none;
        }
        .top-bar #userEmail {
            font-size: 0.75rem !important;
            color: var(--text-muted) !important;
            max-width: 120px !important;
        }
        .top-bar #darkModeToggle {
            cursor: pointer;
            background: none;
            border: none;
            font-size: 1.25rem;
            padding: 6px 8px;
            border-radius: 99px;
            transition: var(--transition);
            line-height: 1;
        }
        .top-bar #darkModeToggle:hover {
            background: var(--track);
        }

        /* Brush toggle FAB */
        .brush-toggle {
            position: fixed;
            bottom: 28px;
            right: 28px;
            background: var(--accent);
            color: white;
            width: 52px;
            height: 52px;
            border-radius: 99px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            box-shadow: 0 8px 24px rgba(99,102,241,.35), 0 2px 8px rgba(99,102,241,.20);
            cursor: pointer;
            z-index: 9998;
            border: none;
            transition: var(--transition);
        }
        .brush-toggle:hover {
            transform: scale(1.1) translateY(-2px);
            box-shadow: 0 12px 32px rgba(99,102,241,.45), 0 4px 12px rgba(99,102,241,.25);
        }
        .brush-toggle:active { transform: scale(0.96); }

        /* Brush toolbar */
        .brush-toolbar {
            position: fixed;
            top: 18px;
            right: 18px;
            display: none;
            align-items: center;
            gap: 10px;
            z-index: 10001;
            background: var(--glass-bg);
            backdrop-filter: blur(var(--glass-blur));
            -webkit-backdrop-filter: blur(var(--glass-blur));
            border: 1px solid var(--border);
            padding: 8px 14px;
            border-radius: 99px;
            box-shadow: var(--shadow-lg);
            transition: background 0.4s ease;
        }
        .brush-toolbar.visible { display: flex; }
        .brush-toolbar input[type="color"] {
            width: 36px;
            height: 36px;
            border: 2px solid var(--border);
            cursor: pointer;
            border-radius: 99px;
            background: none;
            padding: 2px;
            transition: var(--transition);
        }
        .brush-toolbar input[type="color"]:hover {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }
        .brush-toolbar button {
            background: var(--track);
            border: 1px solid var(--border);
            font-size: 1.1rem;
            cursor: pointer;
            padding: 7px 10px;
            border-radius: 99px;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }
        .brush-toolbar button:hover {
            background: var(--accent-soft);
            border-color: var(--accent-glow);
        }

        /* Overlay draw canvas */
        .overlay-draw-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 15;
            pointer-events: none;
            cursor: crosshair;
            touch-action: none;
        }
        .overlay-draw-canvas.active { pointer-events: auto; }

        .toggle-draw-btn {
            position: absolute;
            top: 16px;
            right: 68px;
            z-index: 21;
            background: var(--track);
            border: 1px solid var(--border);
            border-radius: 99px;
            padding: 7px 16px;
            font-size: 0.84rem;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            color: var(--text-secondary);
            font-family: inherit;
        }
        .toggle-draw-btn:hover { color: var(--text); background: var(--track-hover); }
        .toggle-draw-btn.active {
            background: var(--accent);
            border-color: var(--accent);
            color: #ffffff;
            font-weight: 600;
            box-shadow: 0 2px 8px rgba(99,102,241,.30);
        }

        /* ===================== Mobile ===================== */
        @media (max-width: 768px) {
            .sidebar {
                width: 100%;
                flex-direction: row;
                overflow-x: auto;
                overflow-y: hidden;
                padding: 10px;
                height: auto;
                gap: 4px;
            }
            .sidebar h2 { display: none; }
            .sidebar button { flex-shrink: 0; padding: 7px 14px; font-size: 0.8rem; }
            .main { padding: 16px; }
            .main h1 { font-size: 1.3rem; }
            .card-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
            .card { padding: 14px 10px 12px; }
            .card .word { font-size: 1.2rem; }
            .overlay-content {
                width: 96vw;
                height: auto;
                aspect-ratio: auto;
                max-height: 90vh;
                border-radius: var(--radius-lg);
            }
            .overlay-scroll { padding: 20px 16px 8px; }
            .overlay-note-area { padding: 8px 16px 14px; }
            .word-main h2 { font-size: 1.5rem; }
            .top-bar { top: 8px; right: 8px; padding: 4px 6px; gap: 4px; }
        }

        /* ===================== Dark Mode ===================== */
        body.dark {
            --primary: #f1f5f9;
            --accent: #818cf8;
            --accent-hover: #6366f1;
            --accent-soft: rgba(129,140,248,.15);
            --accent-glow: rgba(129,140,248,.30);
            --bg: #0c0f1a;
            --bg-subtle: #111827;
            --card-bg: rgba(17,24,42,.80);
            --card-bg-solid: #111827;
            --text: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --border: rgba(51,65,85,.60);
            --border-strong: #334155;
            --track: #1e293b;
            --track-hover: #334155;
            --shadow-sm: 0 1px 2px rgba(0,0,0,.20);
            --shadow: 0 1px 3px rgba(0,0,0,.30), 0 4px 16px rgba(0,0,0,.25);
            --shadow-lg: 0 4px 24px rgba(0,0,0,.35), 0 12px 40px rgba(0,0,0,.20);
            --shadow-xl: 0 8px 40px rgba(0,0,0,.45), 0 20px 60px rgba(0,0,0,.25);
            --tag-core: #f87171;
            --tag-high: #fbbf24;
            --tag-low: #6b7280;
            --tag-recog: #34d399;
            --tag-core-bg: rgba(248,113,113,.15);
            --tag-high-bg: rgba(251,191,36,.15);
            --tag-low-bg: rgba(107,114,128,.15);
            --tag-recog-bg: rgba(52,211,153,.15);
            --glass-bg: rgba(17,24,42,.70);
            --glass-border: rgba(51,65,85,.30);
        }
        body.dark .main {
            background:
                radial-gradient(ellipse 800px 500px at 80% -5%, rgba(129,140,248,.08), transparent 60%),
                radial-gradient(ellipse 600px 400px at 10% 100%, rgba(52,211,153,.04), transparent 50%),
                var(--bg);
        }
        body.dark .root-box {
            background: linear-gradient(135deg, rgba(251,191,36,.08), rgba(251,191,36,.04));
            border-color: rgba(251,191,36,.20);
            color: #fbbf24;
        }
        body.dark .overlay {
            background: rgba(0,0,0,.65);
        }
        body.dark .card::before {
            background: linear-gradient(135deg, rgba(129,140,248,.05), transparent 60%);
        }
        body.dark .main::-webkit-scrollbar-thumb,
        body.dark .sidebar::-webkit-scrollbar-thumb,
        body.dark .overlay-scroll::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,.10);
        }
        body.dark .main::-webkit-scrollbar-thumb:hover,
        body.dark .sidebar::-webkit-scrollbar-thumb:hover,
        body.dark .overlay-scroll::-webkit-scrollbar-thumb:hover {
            background: rgba(255,255,255,.18);
        }

        /* ===================== Auth Bar ===================== */
        .auth-bar {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .auth-bar button {
            padding: 6px 14px;
            border-radius: 99px;
            font-size: 0.78rem;
            border: 1px solid var(--border);
            background: var(--card-bg-solid);
            color: var(--text-secondary);
            cursor: pointer;
            transition: var(--transition);
            font-weight: 500;
        }
        .auth-bar button:hover {
            color: var(--text);
            border-color: var(--accent-glow);
            background: var(--accent-soft);
        }
        .auth-bar .user-email {
            font-size: 0.75rem;
            color: var(--text-secondary);
            max-width: 120px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .auth-bar .sync-indicator {
            font-size: 0.7rem;
            color: #10b981;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .auth-bar .sync-indicator.visible { opacity: 1; }

        /* Auth modal */
        .auth-modal-overlay {
            position: fixed; top:0; left:0; width:100%; height:100%;
            background: rgba(15,23,42,.55);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: flex; align-items:center; justify-content:center; z-index:1004;
            animation: overlayFadeIn 0.25s ease forwards;
        }
        .auth-modal {
            background: var(--card-bg-solid);
            border: 1px solid var(--border);
            border-radius: var(--radius-xl);
            padding: 32px;
            max-width: 380px;
            width: 90%;
            box-shadow: var(--shadow-xl);
            color: var(--text);
            animation: overlayContentIn 0.3s cubic-bezier(.16,1,.3,1) forwards;
            transition: background 0.4s ease;
        }
        .auth-modal h2 { font-size: 1.15rem; margin-bottom: 16px; font-weight: 700; letter-spacing: -0.01em; }
        .auth-modal input {
            width: 100%; padding: 11px 14px; border: 1px solid var(--border);
            border-radius: var(--radius-sm); background: var(--track); color: var(--text);
            font-size: 0.88rem; margin-bottom: 10px; outline: none;
            font-family: inherit; transition: border-color 0.2s, box-shadow 0.2s;
        }
        .auth-modal input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
        .auth-modal .auth-error { color: #ef4444; font-size: 0.8rem; margin-bottom: 8px; min-height: 1.2em; }
        .auth-modal .auth-switch { font-size: 0.82rem; color: var(--text-secondary); text-align: center; margin-top: 12px; cursor: pointer; }
        .auth-modal .auth-switch:hover { color: var(--accent); }
    </style>
</head>
<body>
    <div class="top-bar">
        <a href="/" style="padding:5px 12px;border-radius:99px;font-size:0.78rem;border:1px solid var(--border);background:var(--card-bg);color:var(--text-secondary);cursor:pointer;text-decoration:none;transition:all 0.15s;" title="去刷词练习">✏️ 刷词</a>
        <span class="sync-indicator" id="syncIndicator">☁️</span>
        <span class="user-email" id="userEmail" style="display:none;font-size:0.75rem;color:var(--text-secondary);max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;"></span>
        <button id="loginBtn">登录</button>
        <button id="logoutBtn" style="display:none;">退出</button>
        <button id="darkModeToggle" style="cursor:pointer;background:none;border:none;font-size:1.45rem;padding:6px;border-radius:12px;transition:background 0.15s;" title="切换深色模式">🌓</button>
    </div>

    <nav class="sidebar" id="sidebar"></nav>

    <div class="main">
        <h1 id="chapterTitle">🌍 自然地理 · 核心词汇</h1>
        <div class="card-grid" id="cardGrid"></div>
    </div>

    <div class="overlay" id="overlay">
        <div class="overlay-content" id="overlayContent">
        </div>
    </div>

    <canvas id="globalCanvas"></canvas>
    <button class="brush-toggle" id="brushToggle" title="画笔标注">✏️</button>
    <div class="brush-toolbar" id="brushToolbar">
        <input type="color" id="brushColorPicker" value="#e74c3c" title="画笔颜色">
        <button id="clearBrushCanvas" title="清除笔记">🗑️</button>
        <button id="brushClose" title="退出画笔">✕</button>
    </div>

    <script>
        // ===================== 章节列表 =====================
        const chapterList = [
            { id: 1, title: "自然地理" },
            { id: 2, title: "植物研究" },
            { id: 3, title: "动物保护" },
            { id: 4, title: "太空探索" },
            { id: 5, title: "学校教育" },
            { id: 6, title: "科技文明" },
            { id: 7, title: "文化历史" },
            { id: 8, title: "语言演化" },
            { id: 9, title: "文化娱乐" },
            { id: 10, title: "物品材料" },
            { id: 11, title: "时尚潮流" },
            { id: 12, title: "饮食健康" },
            { id: 13, title: "建筑场所" },
            { id: 14, title: "交通旅行" },
            { id: 15, title: "国家政府" },
            { id: 16, title: "社会经济" },
            { id: 17, title: "法律法规" },
            { id: 18, title: "沙场争锋" },
            { id: 19, title: "社会角色" },
            { id: 20, title: "行为动作" },
            { id: 21, title: "身心健康" },
            { id: 22, title: "时间日期" }
        ];

        function escapeHTML(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
        // 全局词汇变量（被 data-x.js 覆盖）
        var vocabulary = [];
        // 当前展示的词汇数据集
        let currentVocabulary = [];
        // 当前选中的章节 ID
        let currentChapter = 1;
        // 弹窗等使用的当前词汇ID
        let currentWordId = null;

        // ===================== 本地持久化（备注/配图按章节+词id归档） =====================
        const noteKey = (chapterId, wordId) => `lecture-note-${chapterId}-${wordId}`;
        const imgKey = (chapterId, wordId) => `lecture-img-${chapterId}-${wordId}`;
        function loadNote(chapterId, wordId) { return localStorage.getItem(noteKey(chapterId, wordId)) || ''; }
        function saveNote(chapterId, wordId, text) {
            try { localStorage.setItem(noteKey(chapterId, wordId), text); }
            catch (e) { console.warn('备注保存失败', e); }
        }

        // ===================== 加载章节数据 =====================
        function loadChapterData(chapterId) {
            // 移除之前可能已经加载的同名 script 标签
            const oldScript = document.querySelector('script[data-chapter]');
            if (oldScript) oldScript.remove();

            return new Promise((resolve, reject) => {
                const script = document.createElement('script');
                script.src = `data-${chapterId}.js`;
                script.setAttribute('data-chapter', chapterId);
                script.onload = () => {
                    // data-x.js 执行后，全局 vocabulary 已被更新
                    if (typeof vocabulary !== 'undefined' && vocabulary.length > 0) {
                        currentVocabulary = vocabulary;
                        // 恢复本地持久化的配图（base64 较大，仅存 localStorage，不写回 data 文件）
                        currentVocabulary.forEach(w => {
                            const img = localStorage.getItem(imgKey(chapterId, w.id));
                            if (img) w.image = img; else delete w.image;
                        });
                        resolve();
                    } else {
                        reject(new Error('词汇数据为空或未定义'));
                    }
                };
                script.onerror = () => reject(new Error('加载 data-' + chapterId + '.js 失败，请检查文件是否存在'));
                document.head.appendChild(script);
            });
        }

        // ===================== 语音 =====================
        let cachedVoices = [];
        async function initVoices() {
            return new Promise(resolve => {
                const voices = speechSynthesis.getVoices();
                if (voices.length > 0) {
                    cachedVoices = voices;
                    resolve(voices);
                } else {
                    speechSynthesis.addEventListener('voiceschanged', () => {
                        cachedVoices = speechSynthesis.getVoices();
                        resolve(cachedVoices);
                    }, { once: true });
                }
            });
        }

        async function speakWord(word) {
            if (!('speechSynthesis' in window)) {
                alert('您的浏览器不支持语音朗读功能');
                return;
            }
            if (cachedVoices.length === 0) await initVoices();
            speechSynthesis.cancel();
            await new Promise(resolve => setTimeout(resolve, 20));

            const utterance = new SpeechSynthesisUtterance(word);
            utterance.lang = 'en-US';
            utterance.rate = 0.9;
            utterance.volume = 1;
            const voices = cachedVoices.length ? cachedVoices : speechSynthesis.getVoices();
            const preferredVoice = voices.find(v => v.lang === 'en-US') || voices.find(v => v.lang.startsWith('en'));
            if (preferredVoice) utterance.voice = preferredVoice;
            utterance.onend = () => {};
            utterance.onerror = (e) => {
                if (e.error !== 'canceled') console.warn('朗读出错:', e.error);
            };
            speechSynthesis.speak(utterance);
        }
        initVoices();

        // ===================== 侧边栏 =====================
        function buildSidebar() {
            const sidebar = document.getElementById('sidebar');
            let html = '<h2>章节</h2>';
            chapterList.forEach(ch => {
                html += `<button data-chapter="${ch.id}" class="${ch.id === currentChapter ? 'active' : ''}">${ch.id}. ${ch.title}</button>`;
            });
            sidebar.innerHTML = html;

            sidebar.querySelectorAll('button').forEach(btn => {
                btn.addEventListener('click', function() {
                    const chapterId = parseInt(this.dataset.chapter);
                    switchChapter(chapterId);
                });
            });
        }

        function switchChapter(chapterId) {
            currentChapter = chapterId;
            const ch = chapterList.find(c => c.id === chapterId);
            document.getElementById('chapterTitle').textContent = '🌍 ' + (ch ? ch.title : '') + ' · 核心词汇';
            // 更新侧边栏激活样式
            document.querySelectorAll('.sidebar button').forEach(btn => {
                btn.classList.remove('active');
                if (parseInt(btn.dataset.chapter) === chapterId) btn.classList.add('active');
            });
            // 加载对应数据
            loadChapterData(chapterId)
                .then(() => renderCards())
                .catch(err => {
                    console.error(err);
                    document.getElementById('cardGrid').innerHTML = '<p style="padding:20px;color:#e74c3c;">' + err.message + '</p>';
                });
        }

        // ===================== 渲染卡片 =====================
        function renderCards() {
            const grid = document.getElementById('cardGrid');
            if (!currentVocabulary.length) {
                grid.innerHTML = '<div style="padding:40px;text-align:center;color:var(--text-secondary);"><p style="font-size:1.2rem;margin-bottom:8px;">📭</p><p>本单元暂无词汇</p></div>';
                return;
            }
            grid.innerHTML = currentVocabulary.map((word, i) => `
                <div class="card" data-id="${word.id}" style="animation-delay:${Math.min(i * 25, 500)}ms">
                    <button class="upload-icon-sm" data-action="upload" title="添加图片">+</button>
                    <div class="word">${escapeHTML(word.word)}</div>
                    <div class="phonetic">${escapeHTML(word.phonetic)}</div>
                    <span class="pos">${escapeHTML(word.pos)}</span>
                    <span class="tag tag-${word.tag === '核心' ? 'core' : word.tag === '高频' ? 'high' : word.tag === '低频' ? 'low' : 'recog'}">${word.tag}</span>
                    <div class="meaning">${escapeHTML(word.meaningCN)}</div>
                    <div class="card-actions">
                        <button class="btn-icon" data-action="speak" title="朗读">🔊</button>
                    </div>
                </div>
            `).join('');
        }

        // 卡片事件委托（避免内联 onclick，且单词含特殊字符时不会断开脚本）
        document.getElementById('cardGrid').addEventListener('click', function(e) {
            const speakBtn = e.target.closest('[data-action="speak"]');
            const uploadBtn = e.target.closest('[data-action="upload"]');
            const card = e.target.closest('.card');
            if (!card) return;
            const wordId = parseInt(card.dataset.id);
            const word = currentVocabulary.find(w => w.id === wordId);
            if (speakBtn) { if (word) speakWord(word.word); return; }
            if (uploadBtn) { triggerUpload(wordId, e); return; }
            openOverlay(wordId);
        });

        // ===================== 图片上传 =====================
        function triggerUpload(wordId, event) {
            if (event) event.stopPropagation();
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'image/*';
            input.onchange = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (ev) => {
                    const base64 = ev.target.result;
                    const word = currentVocabulary.find(w => w.id === wordId);
                    if (word) word.image = base64;
                    try { localStorage.setItem(imgKey(currentChapter, wordId), base64); }
                    catch (err) { alert('图片过大，本地存储失败：' + err.message); }
                    if (currentWordId === wordId && document.getElementById('overlay').classList.contains('active')) {
                        updateOverlayImage(base64);
                    }
                    renderCards();
                };
                reader.readAsDataURL(file);
            };
            input.click();
        }

        // ===================== 弹窗及批注 =====================
        let overlayDrawCanvas, overlayDrawCtx, overlayDrawEnabled = false;
        let overlayCanvasResizeHandler = null;

        function openOverlay(wordId) {
            currentWordId = wordId;
            const word = currentVocabulary.find(w => w.id === wordId);
            if (!word) return;
            const overlay = document.getElementById('overlay');
            const content = document.getElementById('overlayContent');
            const tagClass = `tag-${word.tag === '核心' ? 'core' : word.tag === '高频' ? 'high' : word.tag === '低频' ? 'low' : 'recog'}`;

            content.innerHTML = `
                <button class="close-btn" id="closeOverlayBtn">✕</button>
                <button class="toggle-draw-btn" id="toggleDrawBtn">🖌️ 批注</button>
                <canvas class="overlay-draw-canvas" id="overlayDrawCanvas"></canvas>
                <div class="overlay-scroll">
                    <div class="word-main">
                        <h2>${escapeHTML(word.word)}</h2>
                        <span class="phonetic">${escapeHTML(word.phonetic)}</span>
                        <button class="btn-icon" id="overlaySpeakBtn">🔊</button>
                    </div>
                    <span class="pos-badge">${escapeHTML(word.pos)}</span>
                    <span class="tag-badge ${tagClass}">${escapeHTML(word.tag)}</span>
                    <div class="meaning-large">${escapeHTML(word.meaningCN)}</div>
                    <div class="example-box">
                        "${escapeHTML(word.exampleEN)}"
                        <span class="cn">${escapeHTML(word.exampleCN)}</span>
                    </div>
                    <div class="root-box">📚 ${escapeHTML(word.root)}</div>
                    <div class="extra-box">${escapeHTML(word.extra || '')}</div>
                    <div class="image-preview" id="overlayImage">
                        ${word.image ? `<img src="${word.image}" alt="配图">` : ''}
                    </div>
                </div>
                <div class="overlay-note-area">
                    <textarea class="lecture-note" placeholder="在此输入讲解备注..." id="lectureNote"></textarea>
                </div>
            `;

            overlay.classList.add('active');
            document.getElementById('closeOverlayBtn').addEventListener('click', closeOverlay);
            document.getElementById('overlaySpeakBtn').addEventListener('click', () => speakWord(word.word));

            const note = document.getElementById('lectureNote');
            note.value = loadNote(currentChapter, wordId);
            note.addEventListener('input', () => {
                autoResize(note);
                saveNote(currentChapter, wordId, note.value);
            });
            autoResize(note);

            initOverlayDrawCanvas();
            document.addEventListener('keydown', handleKeyNav);
        }

        function closeOverlay() {
            document.getElementById('overlay').classList.remove('active');
            document.removeEventListener('keydown', handleKeyNav);
            if (overlayCanvasResizeHandler) {
                window.removeEventListener('resize', overlayCanvasResizeHandler);
                overlayCanvasResizeHandler = null;
            }
            overlayDrawEnabled = false;
            currentWordId = null;
            overlayDrawCanvas = null;
            overlayDrawCtx = null;
        }

        function updateOverlayImage(base64) {
            const imgDiv = document.getElementById('overlayImage');
            if (imgDiv) imgDiv.innerHTML = `<img src="${base64}" alt="配图">`;
        }

        function autoResize(el) {
            el.style.height = 'auto';
            el.style.height = (el.scrollHeight) + 'px';
        }

        function initOverlayDrawCanvas() {
            const canvas = document.getElementById('overlayDrawCanvas');
            const toggleBtn = document.getElementById('toggleDrawBtn');
            overlayDrawCanvas = canvas;
            overlayDrawCtx = canvas.getContext('2d');

            function resizeOverlayCanvas() {
                const rect = canvas.parentElement.getBoundingClientRect();
                canvas.width = rect.width;
                canvas.height = rect.height;
                overlayDrawCtx.fillStyle = 'rgba(255,255,255,0)';
                overlayDrawCtx.clearRect(0, 0, canvas.width, canvas.height);
            }
            resizeOverlayCanvas();
            // 先移除上一次可能残留的监听，避免每次打开弹窗叠加 resize 监听导致内存泄漏
            if (overlayCanvasResizeHandler) window.removeEventListener('resize', overlayCanvasResizeHandler);
            overlayCanvasResizeHandler = resizeOverlayCanvas;
            window.addEventListener('resize', overlayCanvasResizeHandler);

            let painting = false;
            let lastX, lastY;

            canvas.addEventListener('pointerdown', (e) => {
                if (!overlayDrawEnabled) return;
                if (e.pointerType === 'pen' || e.pointerType === 'touch') e.preventDefault();
                painting = true;
                const rect = canvas.getBoundingClientRect();
                lastX = e.clientX - rect.left;
                lastY = e.clientY - rect.top;
                overlayDrawCtx.beginPath();
            });

            canvas.addEventListener('pointermove', (e) => {
                if (!painting || !overlayDrawEnabled) return;
                if (e.pointerType === 'pen' || e.pointerType === 'touch') e.preventDefault();
                const rect = canvas.getBoundingClientRect();
                const events = e.getCoalescedEvents();
                if (events && events.length > 0) {
                    for (const coalescedEvent of events) {
                        const x = coalescedEvent.clientX - rect.left;
                        const y = coalescedEvent.clientY - rect.top;
                        drawOverlayLine(lastX, lastY, x, y);
                        lastX = x;
                        lastY = y;
                    }
                } else {
                    const x = e.clientX - rect.left;
                    const y = e.clientY - rect.top;
                    drawOverlayLine(lastX, lastY, x, y);
                    lastX = x;
                    lastY = y;
                }
            });

            canvas.addEventListener('pointerup', () => painting = false);
            canvas.addEventListener('pointerleave', () => painting = false);
            canvas.addEventListener('pointercancel', () => painting = false);

            function drawOverlayLine(x0, y0, x1, y1) {
                overlayDrawCtx.strokeStyle = '#ff0000';
                overlayDrawCtx.lineWidth = 2;
                overlayDrawCtx.lineCap = 'round';
                overlayDrawCtx.lineJoin = 'round';
                overlayDrawCtx.beginPath();
                overlayDrawCtx.moveTo(x0, y0);
                overlayDrawCtx.lineTo(x1, y1);
                overlayDrawCtx.stroke();
            }

            toggleBtn.addEventListener('click', () => {
                overlayDrawEnabled = !overlayDrawEnabled;
                if (overlayDrawEnabled) {
                    canvas.classList.add('active');
                    toggleBtn.classList.add('active');
                    toggleBtn.textContent = '✕ 关闭批注';
                } else {
                    canvas.classList.remove('active');
                    toggleBtn.classList.remove('active');
                    toggleBtn.textContent = '🖌️ 批注';
                }
            });
        }

        // 键盘导航
        function handleKeyNav(e) {
            if (!document.getElementById('overlay').classList.contains('active')) return;
            if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') return;

            const currentIndex = currentVocabulary.findIndex(w => w.id === currentWordId);
            if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
                e.preventDefault();
                const direction = e.key === 'ArrowRight' ? 1 : -1;
                const newIndex = (currentIndex + direction + currentVocabulary.length) % currentVocabulary.length;
                const newWord = currentVocabulary[newIndex];
                closeOverlay();
                openOverlay(newWord.id);
            } else if (e.key === ' ') {
                e.preventDefault();
                const word = currentVocabulary.find(w => w.id === currentWordId);
                if (word) speakWord(word.word);
            } else if (e.key === 'Escape') {
                e.preventDefault();
                closeOverlay();
            }
        }

        // ===================== 全局画笔 =====================
        const canvas = document.getElementById('globalCanvas');
        const ctx = canvas.getContext('2d');
        const brushToggle = document.getElementById('brushToggle');
        const brushToolbar = document.getElementById('brushToolbar');
        const brushClose = document.getElementById('brushClose');
        const brushColorPicker = document.getElementById('brushColorPicker');
        const clearBrushCanvasBtn = document.getElementById('clearBrushCanvas');
        let painting = false;
        let lastX, lastY;
        let brushColor = brushColorPicker.value;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            ctx.fillStyle = 'rgba(255,255,255,0)';
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function startPaintGlobal(e) {
            if (e.pointerType === 'pen' || e.pointerType === 'touch') e.preventDefault();
            painting = true;
            lastX = e.clientX;
            lastY = e.clientY;
            ctx.beginPath();
        }

        function drawGlobal(e) {
            if (!painting) return;
            if (e.pointerType === 'pen' || e.pointerType === 'touch') e.preventDefault();
            const events = e.getCoalescedEvents();
            if (events && events.length > 0) {
                for (const coalescedEvent of events) {
                    const x = coalescedEvent.clientX;
                    const y = coalescedEvent.clientY;
                    drawLineGlobal(lastX, lastY, x, y);
                    lastX = x;
                    lastY = y;
                }
            } else {
                drawLineGlobal(lastX, lastY, e.clientX, e.clientY);
                lastX = e.clientX;
                lastY = e.clientY;
            }
        }

        function drawLineGlobal(x0, y0, x1, y1) {
            ctx.lineWidth = 3;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.strokeStyle = brushColor;
            ctx.beginPath();
            ctx.moveTo(x0, y0);
            ctx.lineTo(x1, y1);
            ctx.stroke();
        }

        function endPaintGlobal() {
            painting = false;
            lastX = undefined;
            lastY = undefined;
        }

        function enterBrushMode() {
            canvas.style.display = 'block';
            brushToolbar.classList.add('visible');
            brushToggle.style.display = 'none';
            canvas.addEventListener('pointerdown', startPaintGlobal);
            canvas.addEventListener('pointermove', drawGlobal);
            canvas.addEventListener('pointerup', endPaintGlobal);
            canvas.addEventListener('pointerleave', endPaintGlobal);
            canvas.addEventListener('pointercancel', endPaintGlobal);
        }

        function exitBrushMode() {
            canvas.style.display = 'none';
            brushToolbar.classList.remove('visible');
            brushToggle.style.display = 'flex';
            painting = false;
            lastX = undefined;
            lastY = undefined;
            canvas.removeEventListener('pointerdown', startPaintGlobal);
            canvas.removeEventListener('pointermove', drawGlobal);
            canvas.removeEventListener('pointerup', endPaintGlobal);
            canvas.removeEventListener('pointerleave', endPaintGlobal);
            canvas.removeEventListener('pointercancel', endPaintGlobal);
        }

        brushToggle.addEventListener('click', enterBrushMode);
        brushClose.addEventListener('click', exitBrushMode);
        brushColorPicker.addEventListener('input', (e) => brushColor = e.target.value);
        clearBrushCanvasBtn.addEventListener('click', () => ctx.clearRect(0, 0, canvas.width, canvas.height));
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && canvas.style.display === 'block') exitBrushMode();
        });

        // ===================== 启动应用 =====================
        buildSidebar();
        // overlay 点击背景关闭（只绑定一次，避免泄漏）
        document.getElementById('overlay').addEventListener('click', function(e) {
            if (e.target === this) closeOverlay();
        });
        // 默认加载第一章
        switchChapter(1);

        // ===== 认证模块初始化 =====
        VocabAuth.configure({ apiBase: window.VOCAB_API_BASE || '' });
        VocabAuth.init();

        document.getElementById('darkModeToggle').addEventListener('click', () => {
            document.body.classList.toggle('dark');
            localStorage.setItem('vocab:dark-mode', document.body.classList.contains('dark'));
        });
        if(localStorage.getItem('vocab:dark-mode') === 'true') document.body.classList.add('dark');
    </script>
</body>
</html>

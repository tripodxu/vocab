<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>真经刷词 · 拼写 + 认词</title>
    <meta name="description" content="雅思核心词汇练习：看中文/听音拼写，或看英文选中文（认词）；错词自动复现、多端同步。" />
    <meta name="theme-color" content="#f6f2ea" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="ui.css" />
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <div class="app-bg" aria-hidden="true"></div>

    <!-- 图标 sprite（同源内联；结构性控件用 SVG 图标，不再用 emoji） -->
    <svg id="sprite" xmlns="http://www.w3.org/2000/svg" style="display: none" aria-hidden="true">
      <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
      <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 8h8M16 8h4M4 16h4M12 16h8"/><circle cx="14" cy="8" r="2"/><circle cx="10" cy="16" r="2"/></symbol>
      <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c1.3-3.5 4-5.2 7-5.2s5.7 1.7 7 5.2"/></symbol>
      <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M19.9 12a7.9 7.9 0 1 1-2.3-5.6"/><path d="M20.5 4.2V8h-3.8"/></symbol>
      <symbol id="i-cloud" viewBox="0 0 24 24"><path d="M7.5 18.5A4.5 4.5 0 0 1 7.9 9.6a6 6 0 0 1 11.4.4 3.8 3.8 0 0 1-.8 8.5z"/></symbol>
      <symbol id="i-check-circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M8.2 12.4l2.7 2.7 5-5.6"/></symbol>
      <symbol id="i-x-circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M9.2 9.2l5.6 5.6M14.8 9.2l-5.6 5.6"/></symbol>
      <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 4.2L2.8 19.8h18.4z"/><path d="M12 10v4"/><path d="M12 17.2h.01"/></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></symbol>
      <symbol id="i-book-open" viewBox="0 0 24 24"><path d="M12 7.2c-1.8-1.5-4.2-2.2-7-2v12c2.8 0 5.2.5 7 2 1.8-1.5 4.2-2 7-2v-12c-2.8 0-5.2.5-7 2z"/><path d="M12 7.2v12"/></symbol>
      <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M4.5 19.5l4.3-1L20 7.3a1.9 1.9 0 0 0 0-2.7l-.6-.6a1.9 1.9 0 0 0-2.7 0L5.5 15.2z"/><path d="M14.5 5.5l4 4"/></symbol>
      <symbol id="i-volume" viewBox="0 0 24 24"><path d="M4 9.5v5h3.5L12 19V5L7.5 9.5z"/><path d="M15.5 9.2a4 4 0 0 1 0 5.6"/><path d="M18.2 6.5a8 8 0 0 1 0 11"/></symbol>
      <symbol id="i-lightbulb" viewBox="0 0 24 24"><path d="M9.5 18.5h5M10.2 21.2h3.6"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.7.5 1.1 1.3 1.1 2.2h5c0-.9.4-1.7 1.1-2.2A6 6 0 0 0 12 3z"/></symbol>
      <symbol id="i-timer" viewBox="0 0 24 24"><circle cx="12" cy="13.5" r="7.3"/><path d="M12 13.5V9.6M9.6 2.8h4.8M18.4 6.4l1.4-1.4"/></symbol>
      <symbol id="i-skip-fwd" viewBox="0 0 24 24"><path d="M5.5 6.5v11l9-5.5z"/><path d="M18 6v12"/></symbol>
      <symbol id="i-skip-back" viewBox="0 0 24 24"><path d="M18.5 6.5v11l-9-5.5z"/><path d="M6 6v12"/></symbol>
      <symbol id="i-reset" viewBox="0 0 24 24"><path d="M4.5 5.5v5h5"/><path d="M5.4 13.5a7.5 7.5 0 1 0 1.5-6.4"/></symbol>
      <symbol id="i-flag" viewBox="0 0 24 24"><path d="M6 21V4"/><path d="M6 4.5h11l-2.6 4.2L17 13H6"/></symbol>
      <symbol id="i-image" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="14" rx="2.2"/><circle cx="9" cy="10" r="1.6"/><path d="M4.5 17.5l4.8-4.2 3.7 3.2 3-2.6 3.5 3.6"/></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4.5 7h15M9.5 7V5.6A1.6 1.6 0 0 1 11.1 4h1.8a1.6 1.6 0 0 1 1.6 1.6V7M7 7l.9 12.1A2 2 0 0 0 9.9 21h4.2a2 2 0 0 0 2-1.9L17 7"/><path d="M10.4 11v6M13.6 11v6"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M15.8 15.8l4.7 4.7"/></symbol>
      <symbol id="i-chevron-left" viewBox="0 0 24 24"><path d="M14.5 6l-6 6 6 6"/></symbol>
      <symbol id="i-chevron-right" viewBox="0 0 24 24"><path d="M9.5 6l6 6-6 6"/></symbol>
      <symbol id="i-more" viewBox="0 0 24 24"><circle cx="6" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="18" cy="12" r="1.4"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
      <symbol id="i-nib" viewBox="0 0 24 24"><path d="M12 3l5.5 8.5L12 21 6.5 11.5z"/><circle cx="12" cy="11.5" r="1.7"/></symbol>
      <symbol id="i-brush" viewBox="0 0 24 24"><path d="M15.5 4.5l4 4L9.5 18.5H5.5v-4z"/><path d="M13.5 6.5l4 4"/></symbol>
    </svg>

    <div class="page">
      <header class="topbar">
        <div class="topbar-inner">
          <div class="brand">
            <span class="brand-mark" aria-hidden="true"><svg class="icon" viewBox="0 0 24 24"><use href="#i-nib"></use></svg></span>
            <span class="brand-text">
              <b>真经刷词</b>
              <small id="brandSub">第1章</small>
            </span>
          </div>
          <div class="goal" id="goalRing" role="img" aria-label="今日目标进度">
            <svg class="goal-ring" viewBox="0 0 26 26" aria-hidden="true">
              <circle class="ring-bg" cx="13" cy="13" r="10"></circle>
              <circle class="ring-fg" cx="13" cy="13" r="10"></circle>
            </svg>
            <span class="goal-num" id="goalNum">0</span>
          </div>
          <a class="btn btn-icon btn-ghost" href="课程讲义.html" title="查看词汇讲义" aria-label="查看词汇讲义"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-book-open"></use></svg></a>
          <button id="syncBtn" class="btn btn-icon btn-ghost" type="button" title="同步状态" aria-label="同步状态"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-user"></use></svg></button>
          <button id="menuBtn" class="btn btn-icon btn-ghost" type="button" title="学习面板" aria-label="打开学习面板"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-menu"></use></svg></button>
        </div>
      </header>

      <main class="card stage" aria-labelledby="stageTitle">
        <h1 id="stageTitle" class="sr-only">词汇拼写练习</h1>

        <div class="stage-head" id="stageHead">
          <button id="chapterBtn" class="btn btn-sm chapter-btn" type="button" aria-label="切换章节">第1章</button>
          <div class="seg seg-practice" id="practiceSeg" role="group" aria-label="练习方式">
            <button type="button" data-practice="spell" aria-pressed="true">拼写</button>
            <button type="button" data-practice="choice" aria-pressed="false">认词</button>
          </div>
          <span class="spacer"></span>
          <span class="meta" id="sessionMeta">0/0</span>
          <span class="chip timer-chip" id="timerChip" hidden><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-timer"></use></svg><span id="timerText">00:10</span></span>
        </div>

        <div class="progress thin" aria-hidden="true"><i id="progressFill" style="width: 0%"></i></div>

        <div class="session-banner" id="reviewBanner" hidden>
          <span>复习模式 · 只练错题与生词</span>
          <button class="btn btn-sm" id="reviewExit" type="button">退出复习</button>
        </div>

        <div class="loading-card" id="loadingCard" hidden>
          <span class="spinner" aria-hidden="true"></span>
          <span id="loadingText">正在加载词库…</span>
        </div>

        <div class="stack" id="loadErrorCard" hidden>
          <p class="feedback bad" id="loadErrorText">词库加载失败</p>
          <p class="small muted" id="loadErrorHint">
            常见原因：网络抖动或代理中断。可以点「重试」，或先换一个章节。
          </p>
          <div class="row" style="gap: 8px; flex-wrap: wrap">
            <button class="btn btn-primary" id="retryBtn" type="button">重试</button>
            <button class="btn" id="errorChapterBtn" type="button">选择其他章节</button>
          </div>
        </div>

        <div class="stack-3" id="stageBody" hidden>
          <div class="prompt">
            <div class="prompt-cn" id="promptCn"></div>
            <div class="prompt-audio" id="promptAudio" hidden>
              <button class="speak-btn" id="speakBtn" type="button" aria-label="播放单词发音"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-volume"></use></svg></button>
              <span id="promptHint">听音拼写</span>
            </div>
            <!-- 认词模式的题干：英文单词 + 音标（听音出题时隐藏，答完再揭示） -->
            <div class="prompt-word" id="promptWord" hidden>
              <div class="pw-en" id="promptWordEn"></div>
              <div class="pw-sub">
                <span class="pw-phonetic" id="promptPhonetic"></span>
                <button class="speak-mini" id="promptSpeak" type="button" aria-label="播放单词发音"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-volume"></use></svg></button>
              </div>
            </div>
          </div>

          <div class="spell-area" id="spellArea">
            <div class="slots-wrap" id="slotsWrap">
              <div class="slots" id="slots" aria-hidden="true"></div>
              <input
                id="answerInput"
                class="answer-input"
                type="text"
                inputmode="latin"
                autocomplete="off"
                autocorrect="off"
                autocapitalize="off"
                spellcheck="false"
                enterkeyhint="go"
                aria-label="输入拼写"
              />
            </div>
            <p class="tap-hint" id="tapHint"></p>
          </div>

          <!-- 认词模式：看英文选中文 -->
          <div class="choice-area" id="choiceArea" hidden>
            <div class="options" id="options" role="radiogroup" aria-label="选择正确的释义"></div>
            <p class="tap-hint" id="choiceHint">点选项作答 · 键盘 1-4 / A-D</p>
          </div>

          <div class="feedback" id="feedback" role="status"></div>

          <!-- 辨析：答错时逐条说明干扰项差在哪 -->
          <div class="quiz-note" id="quizNote" hidden>
            <div class="quiz-note-head" id="quizNoteHead"></div>
            <ul class="quiz-note-list" id="quizNoteList"></ul>
            <div class="quiz-note-foot small muted" id="quizNoteFoot"><span id="quizNoteFootText"></span><button class="report-btn" id="reportBtn" type="button" hidden title="反馈题目问题（选项过于相近、答案有误等）"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-flag"></use></svg>报错</button></div>
          </div>

          <div class="example" id="example" hidden>
            <span class="en" id="exampleEn"></span>
            <span class="cn" id="exampleCn"></span>
          </div>

          <!-- 底部拇指区操作坞：1 个主 CTA + 次要操作，其余进「更多」菜单 -->
          <div class="actions" id="actionsDock">
            <div class="actions-main">
              <button class="btn dock-star" id="starBtn" type="button" aria-pressed="false">☆ 生词</button>
              <button class="btn" id="dontBtn" type="button" hidden>不会</button>
              <button class="btn btn-primary btn-lg" id="primaryBtn" type="button">提交</button>
              <button class="btn" id="prevBtn" type="button" disabled title="回看上一词（可补标生词，重答不计双倍）">上一个</button>
              <button class="btn btn-icon" id="moreBtn" type="button" aria-expanded="false" aria-controls="quickMenu" title="更多操作" aria-label="更多操作"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-more"></use></svg></button>
            </div>

            <!-- 更多操作菜单：出题方式 / 提示 / 再读 / 计时 / 跳过 / 重置（id 保持不变，事件绑定零改动） -->
            <div class="quick-menu" id="quickMenu" hidden>
              <div class="seg" id="modeSeg" role="group" aria-label="出题方式"></div>
              <label class="hint-pick" id="hintPick" title="提示字母：给出首字母或随机几个字母">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-lightbulb"></use></svg>
                <select id="hintSelect" aria-label="提示字母数量">
                  <option value="0">无提示</option>
                  <option value="1">首字母</option>
                  <option value="2">随机2字母</option>
                  <option value="3">随机3字母</option>
                </select>
              </label>
              <div class="quick-menu-row">
                <button class="btn" id="repeatBtn" type="button">再读</button>
                <button class="btn" id="timerBtn" type="button">计时</button>
                <button class="btn" id="skipBtn" type="button">跳过</button>
                <button class="btn" id="resetBtn" type="button">重置</button>
              </div>
            </div>
          </div>
        </div>
      </main>

      <p class="footnote">
        <kbd>Enter</kbd> 提交 / 下一题 · <kbd>←</kbd><kbd>→</kbd> 移动光标 · <kbd>空格</kbd> 重读 ·
        认词模式 <kbd>1</kbd>-<kbd>4</kbd> 选项 · 空格与连字符会自动占位
      </p>
    </div>

    <script type="module" src="app.js"></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>真经刷词神器 · 稳定版</title>
  <script src="vocab-auth.js"></script>
  <script>window.VOCAB_API_BASE = '';</script>
  <style>
    :root {
      --bg: #f4f6fb;
      --panel-bg: #ffffff;
      --text: #101828;
      --text-secondary: #667085;
      --border: #e6e9f2;
      --slot-border: #d7dde9;
      --accent: #5a5ce0;
      --accent-strong: #4a4cd0;
      --accent-soft: rgba(90,92,224,.14);
      --accent-light: #eef0ff;
      --correct: #0e9f6e;
      --wrong: #e04747;
      --card-bg: #f8fafd;
      --track: #eef1f7;
      --shadow: 0 1px 2px rgba(16,24,40,.05), 0 18px 45px rgba(16,24,40,.10);
      --sidebar-bg: #ffffff;
    }
    body.dark {
      --bg: #0b1220;
      --panel-bg: #111a2c;
      --text: #eef2fa;
      --text-secondary: #97a3b8;
      --border: #223049;
      --slot-border: #2e3d59;
      --accent: #868cff;
      --accent-strong: #9ba0ff;
      --accent-soft: rgba(134,140,255,.20);
      --accent-light: #1e2542;
      --correct: #34d399;
      --wrong: #f87171;
      --card-bg: #16213a;
      --track: #1a2740;
      --shadow: 0 1px 2px rgba(0,0,0,.45), 0 18px 45px rgba(0,0,0,.55);
      --sidebar-bg: #111a2c;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Inter', 'Segoe UI', 'HarmonyOS Sans SC', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
      background: radial-gradient(1100px 480px at 88% -8%, var(--accent-soft), transparent 62%), var(--bg);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      transition: background 0.3s, color 0.3s;
    }
    .container {
      width: 100%;
      max-width: 1000px;
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 24px;
      box-shadow: var(--shadow);
      padding: 22px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: background 0.3s, border-color 0.3s;
      position: relative;
      overflow: hidden;
    }
    .header-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    h1 { font-size: 1.35rem; font-weight: 700; letter-spacing: -0.01em; color: var(--text); }
    .sub { font-size: 0.8rem; color: var(--text-secondary); margin-top: 3px; }
    .top-controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .select-style {
      padding: 9px 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--card-bg);
      color: var(--text);
      font-size: 0.88rem;
      font-weight: 500;
      cursor: pointer;
      transition: border-color 0.15s, box-shadow 0.15s;
      font-family: inherit;
    }
    .select-style:hover { border-color: var(--slot-border); }
    .mode-group, .tool-group {
      display: flex;
      gap: 3px;
      background: var(--track);
      border-radius: 14px;
      padding: 4px;
    }
    .mode-btn, .tool-btn {
      border: none;
      background: transparent;
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.18s;
      white-space: nowrap;
      box-shadow: none;
    }
    .mode-btn:hover, .tool-btn:hover { color: var(--text); }
    .mode-btn.active, .tool-btn.active {
      background: var(--panel-bg);
      color: var(--accent);
      box-shadow: 0 1px 3px rgba(16,24,40,.12);
      font-weight: 600;
    }
    .hint-select {
      border: none;
      background: transparent;
      padding: 8px 10px;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.18s;
      white-space: nowrap;
      box-shadow: none;
      font-family: inherit;
    }
    .hint-select:hover { color: var(--text); }
    .hint-select.on {
      background: var(--panel-bg);
      color: var(--accent);
      box-shadow: 0 1px 3px rgba(16,24,40,.12);
      font-weight: 600;
    }
    .progress-bar {
      width: 100%;
      height: 6px;
      background: var(--track);
      border-radius: 99px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), #8b5cf6);
      border-radius: 99px;
      transition: width 0.3s ease;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 8px 6px;
      font-size: 0.88rem;
      color: var(--text-secondary);
    }
    .stats span { text-align: center; }
    .stats strong { font-size: 0.95rem; color: var(--text); font-weight: 700; }
    .mode-indicator {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 99px;
      padding: 5px 14px;
      align-self: center;
      color: var(--text-secondary);
      font-size: 0.82rem;
      flex-wrap: wrap;
    }
    .timer-display { font-weight: 700; color: var(--accent); margin-left: 8px; }
    .speech-status { font-size: 1rem; margin-left: 4px; }
    .chinese-meaning {
      font-size: 2rem;
      font-weight: 700;
      text-align: center;
      color: var(--text);
      letter-spacing: 0.01em;
      min-height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .letter-slots {
      display: flex;
      justify-content: center;
      gap: clamp(4px, 1vw, 8px);
      flex-wrap: wrap;
      margin: 6px 0 2px;
      max-width: 100%;
    }
    .slot {
      width: clamp(32px, 5vw, 46px);
      height: clamp(42px, 6vw, 58px);
      border: 1.5px solid var(--slot-border);
      border-radius: 12px;
      background: var(--card-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(1.2rem, 3vw, 1.85rem);
      font-weight: 700;
      color: var(--text);
      transition: border-color 0.2s, box-shadow 0.2s, background 0.2s, color 0.2s;
      text-transform: lowercase;
      animation: fadeInLetter 0.15s ease;
    }
    @keyframes fadeInLetter { from { opacity:0; transform:translateY(-6px); } to { opacity:1; transform:translateY(0); } }
    .slot.active-slot {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
      animation: pulse 1.4s infinite;
    }
    @keyframes pulse { 0%,100% { box-shadow: 0 0 0 3px var(--accent-soft); } 50% { box-shadow: 0 0 0 6px var(--accent-soft); } }
    .slot.hint { color: var(--text-secondary); font-style: italic; }
    .slot.correct {
      border-color: var(--correct);
      color: var(--correct);
      background: color-mix(in srgb, var(--correct) 9%, var(--card-bg));
      animation: bounceCorrect 0.4s ease;
    }
    .slot.wrong {
      border-color: var(--wrong);
      color: var(--wrong);
      background: color-mix(in srgb, var(--wrong) 9%, var(--card-bg));
      animation: shakeWrong 0.4s ease;
    }
    @keyframes bounceCorrect { 0% { transform: scale(1); } 50% { transform: scale(1.12); } 100% { transform: scale(1); } }
    @keyframes shakeWrong { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
    .result-area { text-align: center; font-weight: 600; min-height: 28px; font-size: 0.95rem; }
    .example-box {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent);
      padding: 12px 16px;
      border-radius: 12px;
      font-style: italic;
      color: var(--text);
      font-size: 0.92rem;
      line-height: 1.55;
      display: none;
    }
    .example-box .cn { font-style: normal; color: var(--text-secondary); font-size: 0.85rem; margin-top: 3px; display: block; }
    .actions {
      display: flex;
      justify-content: center;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 2px;
    }
    .actions button { flex: 0 0 auto; }
    button {
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 9px 16px;
      border-radius: 12px;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      gap: 5px;
      font-family: inherit;
    }
    button:hover { color: var(--text); border-color: var(--slot-border); }
    button:focus-visible, .select-style:focus-visible, .sidebar-search:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
      font-weight: 600;
      box-shadow: 0 6px 16px rgba(90,92,224,.30);
    }
    button.primary:hover { background: var(--accent-strong); border-color: var(--accent-strong); color: white; }
    .books-row { display: flex; gap: 12px; flex-wrap: wrap; }
    .book-panel {
      flex: 1;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 12px;
    }
    .book-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      margin-bottom: 8px;
    }
    .book-header h3 { font-size: 0.95rem; font-weight: 600; color: var(--text); }
    .book-header > span { color: var(--text-secondary); font-size: 0.8rem; }
    .book-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      max-height: 140px;
      overflow-y: auto;
    }
    .word-chip {
      background: rgba(224,71,71,.07);
      border: 1px solid rgba(224,71,71,.22);
      padding: 5px 11px;
      border-radius: 10px;
      font-size: 0.83rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      color: var(--text);
      transition: box-shadow 0.15s;
    }
    .word-chip:hover { box-shadow: 0 2px 8px rgba(224,71,71,.15); }
    .word-chip.new-word { background: rgba(14,159,110,.07); border-color: rgba(14,159,110,.25); }
    .word-chip.new-word:hover { box-shadow: 0 2px 8px rgba(14,159,110,.15); }
    #clearWrongBtn, #clearNewWordsBtn { margin-top: 8px; padding: 3px 10px; font-size: 0.72rem; border-radius: 10px; opacity: 0.7; }
    #clearWrongBtn:hover, #clearNewWordsBtn:hover { opacity: 1; }
    #reviewBookBtn { align-self: center; }
    .footer-note { text-align: center; color: var(--text-secondary); font-size: 0.75rem; margin-top: 4px; }
    .goal-progress {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 99px;
      padding: 5px 12px;
      font-size: 0.83rem;
      color: var(--text-secondary);
    }
    #goalCount { font-weight: 600; color: var(--text); }
    #setGoalBtn { padding: 3px 9px; border-radius: 99px; font-size: 0.75rem; }
    .goal-bar {
      width: 72px;
      height: 6px;
      background: var(--track);
      border-radius: 99px;
      overflow: hidden;
    }
    .goal-fill {
      height: 100%;
      background: linear-gradient(90deg, #f59e0b, #fbbf24);
      border-radius: 99px;
      transition: width 0.3s;
    }
    .modal {
      position: fixed; top:0; left:0; width:100%; height:100%;
      background: rgba(16,24,40,0.45); backdrop-filter: blur(6px);
      display: flex; align-items:center; justify-content:center; z-index:1000;
    }
    .modal-content {
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 26px;
      max-width: 420px;
      width: 90%;
      box-shadow: 0 24px 60px rgba(0,0,0,0.35);
      color: var(--text);
    }
    .modal-content h2 { font-size: 1.15rem; margin-bottom: 10px; }
    .modal-content p { font-size: 0.93rem; margin: 5px 0; color: var(--text); }
    .dark-toggle {
      cursor: pointer; background: none; border: none;
      font-size: 1.45rem; padding: 6px; border-radius: 12px;
      transition: background 0.15s;
    }
    .dark-toggle:hover { background: var(--track); }

    .auth-bar {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .auth-bar button {
      padding: 5px 12px;
      border-radius: 99px;
      font-size: 0.78rem;
      border: 1px solid var(--border);
      background: var(--card-bg);
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.15s;
    }
    .auth-bar button:hover { color: var(--text); border-color: var(--slot-border); }
    .auth-bar .user-email {
      font-size: 0.75rem;
      color: var(--text-secondary);
      max-width: 120px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .auth-bar .sync-indicator {
      font-size: 0.7rem;
      color: var(--correct);
      opacity: 0;
      transition: opacity 0.3s;
    }
    .auth-bar .sync-indicator.visible { opacity: 1; }
    .auth-modal-overlay {
      position: fixed; top:0; left:0; width:100%; height:100%;
      background: rgba(16,24,40,0.45); backdrop-filter: blur(6px);
      display: flex; align-items:center; justify-content:center; z-index:1004;
    }
    .auth-modal {
      background: var(--panel-bg); border: 1px solid var(--border);
      border-radius: 20px; padding: 26px; max-width: 380px; width: 90%;
      box-shadow: 0 24px 60px rgba(0,0,0,0.35); color: var(--text);
    }
    .auth-modal h2 { font-size: 1.1rem; margin-bottom: 14px; }
    .auth-modal input {
      width: 100%; padding: 10px 14px; border: 1px solid var(--border);
      border-radius: 10px; background: var(--card-bg); color: var(--text);
      font-size: 0.88rem; margin-bottom: 10px; outline: none;
      font-family: inherit; transition: border-color 0.15s;
    }
    .auth-modal input:focus { border-color: var(--accent); }
    .auth-modal .auth-error { color: var(--wrong); font-size: 0.8rem; margin-bottom: 8px; min-height: 1.2em; }
    .auth-modal .auth-switch { font-size: 0.82rem; color: var(--text-secondary); text-align: center; margin-top: 10px; cursor: pointer; }
    .auth-modal .auth-switch:hover { color: var(--accent); }

    /* 侧边栏 */
    .sidebar {
      position: fixed;
      top: 0;
      right: -360px;
      width: 345px;
      height: 100vh;
      background: var(--sidebar-bg);
      border-left: 1px solid var(--border);
      box-shadow: -24px 0 60px rgba(16,24,40,0.18);
      z-index: 1002;
      transition: right 0.3s cubic-bezier(.4,0,.2,1);
      display: flex;
      flex-direction: column;
      padding: 18px 16px;
      gap: 12px;
    }
    .sidebar.open { right: 0; }
    .sidebar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }
    .sidebar-header h3 { font-size: 1.05rem; color: var(--text); font-weight: 700; }
    #closeSidebarBtn {
      background: none; border: none; font-size: 1.15rem; cursor: pointer;
      color: var(--text-secondary); padding: 4px 8px; border-radius: 8px;
      transition: background 0.15s, color 0.15s;
    }
    #closeSidebarBtn:hover { background: var(--track); color: var(--text); }
    .sidebar-search {
      width: 100%;
      padding: 8px 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--card-bg);
      color: var(--text);
      font-size: 0.85rem;
      outline: none;
      transition: border-color 0.15s;
      font-family: inherit;
    }
    .sidebar-search:focus { border-color: var(--accent); }
    .sidebar-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .sidebar-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      border-radius: 12px;
      background: var(--card-bg);
      cursor: pointer;
      transition: all 0.15s;
      border: 1px solid var(--border);
      font-size: 0.88rem;
      color: var(--text);
    }
    .sidebar-item:hover { border-color: var(--accent); background: var(--accent-light); }
    .sidebar-item .word-text { font-weight: 600; flex: 1; }
    .sidebar-overlay {
      position: fixed; top:0; left:0; width:100%; height:100%;
      background: rgba(16,24,40,0.35); z-index: 1001; display: none;
    }
    .sidebar-overlay.active { display: block; }

    .top-bar {
      position: fixed;
      top: 14px;
      right: 14px;
      z-index: 1004;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .top-bar a, .top-bar button { flex-shrink: 0; }

    .sidebar-toggle {
      position: fixed;
      top: 60px;
      right: 18px;
      z-index: 1003;
      background: var(--accent);
      color: white;
      border: none;
      width: 44px;
      height: 44px;
      border-radius: 14px;
      font-size: 1.25rem;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(90,92,224,.35);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s;
    }
    .sidebar-toggle:hover { transform: scale(1.06); }
    #nextBtn { min-width: 120px; }
    .timer-display.urgent {
      color: var(--wrong);
      animation: timerPulse 0.5s ease infinite;
    }
    @keyframes timerPulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    @media (max-width: 600px) {
      .sidebar { width: 100%; right: -100%; }
      .container { padding: 18px; border-radius: 20px; }
      .slot { width: clamp(32px, 10vw, 38px); height: clamp(42px, 12vw, 50px); font-size: clamp(1.2rem, 4vw, 1.5rem); }
      .chinese-meaning { font-size: 1.55rem; }
      h1 { font-size: 1.15rem; }
    }
  </style>
</head>
<body>
<div class="top-bar">
  <a href="课程讲义.html" style="padding:5px 12px;border-radius:99px;font-size:0.78rem;border:1px solid var(--border);background:var(--card-bg);color:var(--text-secondary);cursor:pointer;text-decoration:none;transition:all 0.15s;" title="查看词汇讲义">📚 讲义</a>
  <span class="sync-indicator" id="syncIndicator">☁️</span>
  <span class="user-email" id="userEmail" style="display:none;font-size:0.75rem;color:var(--text-secondary);max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;"></span>
  <button id="loginBtn">登录</button>
  <button id="logoutBtn" style="display:none;">退出</button>
  <button id="darkModeToggle" class="dark-toggle" title="切换深色模式">🌓</button>
</div>
<button class="sidebar-toggle" id="sidebarToggle" title="词汇总览">📋</button>
<div class="sidebar-overlay" id="sidebarOverlay"></div>

<!-- 侧边栏 -->
<div class="sidebar" id="vocabSidebar">
  <div class="sidebar-header">
    <h3>📋 词汇总览</h3>
    <button id="closeSidebarBtn" style="background:none;border:none;font-size:1.2rem;cursor:pointer;color:var(--text);">✕</button>
  </div>
  <input type="text" class="sidebar-search" id="sidebarSearch" placeholder="搜索单词或释义...">
  <div class="sidebar-list" id="sidebarList"></div>
</div>

<div class="container">
  <div class="header-row">
    <div>
      <h1>Lexxxi✨ 真经刷词神器</h1>
      <div class="sub">词汇带背课程 · B站 @lexi学姐教雅思</div>
    </div>
  </div>

  <div class="top-controls">
    <select id="chapterSelect" class="select-style"></select>
    <div class="mode-group" id="modeGroup">
      <button class="mode-btn" data-mode="chinese">📖 看中文</button>
      <button class="mode-btn" data-mode="audio">🔊 听音</button>
      <button class="mode-btn active" data-mode="random">🎲 随机</button>
    </div>
  </div>

  <div class="top-controls" style="margin-top:4px;">
    <div class="tool-group">
      <select id="hintSelect" class="hint-select" title="选择提示字母数量">
        <option value="0">💡 无提示</option>
        <option value="1">💡 首字母</option>
        <option value="2">💡 随机2字母</option>
        <option value="3">💡 随机3字母</option>
      </select>
      <button id="timerToggle" class="tool-btn">⏱️ 计时</button>
    </div>
    <div class="goal-progress" id="goalDisplay">
      <span>🎯 每日目标</span>
      <span id="goalCount">0/50</span>
      <div class="goal-bar"><div class="goal-fill" id="goalFill" style="width:0%"></div></div>
      <button id="setGoalBtn">⚙️</button>
    </div>
  </div>
  <div id="timerDisplay" class="mode-indicator" style="display:none;">
    <span>⏳ 剩余时间：</span>
    <span class="timer-display" id="timerSeconds">10</span><span>秒</span>
  </div>

  <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
  <div class="stats">
    <span>📊 进度 <strong id="progressText">0/0</strong></span>
    <span>✅ 正确 <strong id="correctCount">0</strong></span>
    <span>❌ 错误 <strong id="wrongCount">0</strong></span>
  </div>

  <div class="mode-indicator">
    <span id="modeIcon">📖</span> <span id="modeText">准备开始</span>
    <span class="speech-status" id="speechStatus"></span>
  </div>

  <div class="chinese-meaning" id="chineseDisplay"></div>
  <div class="letter-slots" id="letterSlots"></div>
  <div class="result-area" id="resultArea"></div>
  <div class="example-box" id="exampleBox">
    <span id="exampleEN"></span>
    <span class="cn" id="exampleCN"></span>
  </div>

  <div class="actions">
    <button id="addNewWordBtn" title="加入生词本">📌 生词</button>
    <button id="skipBtn">⏭️ 跳过</button>
    <button id="restartBtn">🔄 重新开始</button>
    <button id="repeatBtn">🔊 再读一次</button>
    <button id="nextBtn" class="primary">⏎ 提交 / 下一题</button>
  </div>
  <div class="footer-note">💡 按回车判断，再按回车下一题 | 支持连字符和空格 (例如 high-tech, El nino)</div>

  <div class="books-row">
    <div class="book-panel">
      <div class="book-header" id="wrongBookToggle"><h3>📕 错题本 (<span id="wrongBookCount">0</span>)</h3><span>▼</span></div>
      <div class="book-list" id="wrongList"></div>
      <button id="clearWrongBtn">清空</button>
    </div>
    <div class="book-panel">
      <div class="book-header" id="newWordBookToggle"><h3>📗 生词本 (<span id="newWordCount">0</span>)</h3><span>▼</span></div>
      <div class="book-list" id="newWordList"></div>
      <button id="clearNewWordsBtn">清空</button>
    </div>
  </div>
  <button id="reviewBookBtn" class="primary">📚 复习错题+生词</button>
</div>

<script>
(function() {
  // ===== 认证模块初始化 =====
  VocabAuth.configure({ apiBase: window.VOCAB_API_BASE || '' });
  VocabAuth.init();

  // 音效
  let audioCtx = null;
  function getCtx(){ if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)(); return audioCtx; }
  function playTone(freq,dur,type='sine'){ const c=getCtx(); const o=c.createOscillator(); const g=c.createGain(); o.type=type; o.frequency.value=freq; g.gain.setValueAtTime(0.2,c.currentTime); g.gain.exponentialRampToValueAtTime(0.01,c.currentTime+dur); o.connect(g); g.connect(c.destination); o.start(); o.stop(c.currentTime+dur); }
  function playCorrect(){ playTone(880,0.1); setTimeout(()=>playTone(1100,0.1),100); }
  function playWrong(){ playTone(300,0.15,'square'); setTimeout(()=>playTone(200,0.2,'square'),150); }
  function escapeHTML(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

  const CHAPTERS = [
    "自然地理","植物研究","动物保护","太空探索","学校教育","科技文明",
    "文化历史","语言演化","文化娱乐","物品材料","时尚潮流","饮食健康",
    "建筑场所","交通旅行","国家政府","社会经济","法律法规","沙场争锋",
    "社会角色","行为动作","身心健康","时间日期"
  ];
  const CHAPTER_COUNT = CHAPTERS.length;
  const chapterList = CHAPTERS.map((title,i)=>({id:i+1,title:`第${i+1}章 · ${title}`}));

  let currentVocabulary=[], shuffledWords=[], currentIndex=0, currentWord=null;
  let chapterLoadToken=0, isReviewMode=false;
  let currentMode='chinese', globalMode='random';
  let userInput=[], isAnswered=false, cursor=0;
  let correctTotal=0, wrongTotal=0, completedCount=0;
  let wrongBook=[], newWordBook=[];
  let booksStore={}; // 按章节 id 归档错题/生词，避免跨章节 id 撞车
  let startTime=0;
  let hintCount = 0; // 提示字母数：0=关闭，1=首字母，2/3=随机N个字母
  let hintIdx = new Set(); // 当前词的提示字母所在槽位
  let timerEnabled = false;
  let timerDuration = 10;
  let timerInterval = null;
  let dailyGoal = 50;
  let dailyCount = 0;
  let todayStr = new Date().toISOString().slice(0,10);

  // 语音
  let voices=[], speechReady=false;
  function loadVoices(){ return new Promise(resolve => { voices=speechSynthesis.getVoices(); if(voices.length) resolve(voices); else speechSynthesis.addEventListener('voiceschanged',()=>{ voices=speechSynthesis.getVoices(); resolve(voices); },{once:true}); }); }
  async function initSpeech(){ if(speechReady) return true; try{ await loadVoices(); speechSynthesis.resume(); speechReady=true; return true; }catch(e){ return false; } }
  async function speakWord(word){
    if(!speechSynthesis) return;
    if(!speechReady) await initSpeech();
    speechSynthesis.cancel();
    await new Promise(r=>setTimeout(r,50));
    if(voices.length===0) voices = speechSynthesis.getVoices();
    const u = new SpeechSynthesisUtterance(word); u.lang='en-US'; u.rate=0.9; u.volume=1;
    const pref = voices.find(v=>v.lang==='en-US')||voices.find(v=>v.lang.startsWith('en'));
    if(pref) u.voice=pref;
    const statusEl = document.getElementById('speechStatus');
    u.onstart = ()=> statusEl.textContent='🔊';
    u.onend = ()=> statusEl.textContent='';
    u.onerror = ()=>{ statusEl.textContent='⚠️'; };
    speechSynthesis.speak(u);
  }
  document.addEventListener('click', ()=>initSpeech(), {once:true});
  document.addEventListener('keydown', ()=>initSpeech(), {once:true});

  // DOM
  const chapterSelect = document.getElementById('chapterSelect');
  const progressFill = document.getElementById('progressFill');
  const progressText = document.getElementById('progressText');
  const correctCountEl = document.getElementById('correctCount');
  const wrongCountEl = document.getElementById('wrongCount');
  const modeIcon = document.getElementById('modeIcon'), modeText = document.getElementById('modeText');
  const chineseDisplay = document.getElementById('chineseDisplay');
  const letterSlots = document.getElementById('letterSlots');
  const resultArea = document.getElementById('resultArea');
  const exampleBox = document.getElementById('exampleBox');
  const exampleEN = document.getElementById('exampleEN'), exampleCN = document.getElementById('exampleCN');
  const nextBtn = document.getElementById('nextBtn'), skipBtn = document.getElementById('skipBtn');
  const restartBtn = document.getElementById('restartBtn'), repeatBtn = document.getElementById('repeatBtn');
  const addNewWordBtn = document.getElementById('addNewWordBtn');
  const wrongList = document.getElementById('wrongList'), wrongBookCount = document.getElementById('wrongBookCount');
  const newWordList = document.getElementById('newWordList'), newWordCount = document.getElementById('newWordCount');
  const hintSelect = document.getElementById('hintSelect');
  const timerToggle = document.getElementById('timerToggle');
  const timerDisplay = document.getElementById('timerDisplay');
  const timerSeconds = document.getElementById('timerSeconds');
  const goalCount = document.getElementById('goalCount'), goalFill = document.getElementById('goalFill');
  const setGoalBtn = document.getElementById('setGoalBtn');
  const sidebar = document.getElementById('vocabSidebar');
  const sidebarList = document.getElementById('sidebarList');
  const sidebarSearch = document.getElementById('sidebarSearch');
  const sidebarToggleBtn = document.getElementById('sidebarToggle');
  const closeSidebarBtn = document.getElementById('closeSidebarBtn');
  const sidebarOverlay = document.getElementById('sidebarOverlay');

  // 下拉章节
  chapterList.forEach(ch=>{ const o=document.createElement('option'); o.value=ch.id; o.textContent=ch.title; chapterSelect.appendChild(o); });
  chapterSelect.addEventListener('change', ()=> switchChapter(parseInt(chapterSelect.value)));

  // 模式
  document.querySelectorAll('.mode-btn').forEach(b=>b.addEventListener('click',function(){
    document.querySelectorAll('.mode-btn').forEach(x=>x.classList.remove('active'));
    this.classList.add('active');
    globalMode = this.dataset.mode;
    updateModeIndicator();
    saveState();
  }));

  // 提示/计时
  hintSelect.addEventListener('change', ()=>{
    hintCount = parseInt(hintSelect.value) || 0;
    hintSelect.classList.toggle('on', hintCount > 0);
    applyHintToCurrentWord();
    saveState();
  });
  timerToggle.addEventListener('click', ()=>{ timerEnabled=!timerEnabled; timerToggle.classList.toggle('active',timerEnabled); timerDisplay.style.display=timerEnabled?'flex':'none'; if(!timerEnabled) clearInterval(timerInterval); saveState(); });

  function updateModeIndicator(){
    if(globalMode==='chinese'){ modeIcon.textContent='📖'; modeText.textContent='看中文拼写'; }
    else if(globalMode==='audio'){ modeIcon.textContent='🔊'; modeText.textContent='听音拼写'; }
    else { modeIcon.textContent='🎲'; modeText.textContent='随机模式'; }
  }

  // ========== 存储与恢复 (优化版) ==========
  function saveState(){
    const curChapter = parseInt(chapterSelect.value) || 1;
    booksStore[curChapter] = {
      wrongBookIds: wrongBook.map(w=>w.id),
      newWordBookIds: newWordBook.map(w=>w.id)
    };
    const state = {
      chapter: curChapter,
      globalMode,
      correctTotal, wrongTotal, completedCount,
      currentIndex,
      booksStore,
      shuffledIds: isReviewMode ? [] : shuffledWords.map(w=>w.id),
      hintCount, timerEnabled, timerDuration,
      dailyGoal, dailyCount, today: todayStr,
      savedAt: new Date().toISOString()
    };
    localStorage.setItem('vocab-tool-state', JSON.stringify(state));
    // 云端同步：当前章节完整数据 + 全局设置
    if (VocabAuth.isLoggedIn()) {
      VocabAuth.debounceSave(curChapter, {
        wrongBookIds: wrongBook.map(w=>w.id),
        newWordBookIds: newWordBook.map(w=>w.id),
        correctTotal, wrongTotal, completedCount, currentIndex,
        shuffledIds: isReviewMode ? [] : shuffledWords.map(w=>w.id)
      });
      VocabAuth.saveSettings({ dailyGoal, hintCount, timerEnabled, timerDuration, globalMode });
    }
  }

  function loadBooksForChapter(chapterId){
    const bucket = booksStore[chapterId] || {};
    const idMap = new Map(currentVocabulary.map(w=>[w.id, w]));
    wrongBook = (bucket.wrongBookIds || []).map(id=>idMap.get(id)).filter(Boolean);
    newWordBook = (bucket.newWordBookIds || []).map(id=>idMap.get(id)).filter(Boolean);
  }

  function loadState(){
    const raw = localStorage.getItem('vocab-tool-state');
    if(!raw) return Promise.resolve(false);
    try{
      const state = JSON.parse(raw);
      chapterSelect.value = state.chapter || 1;
      globalMode = state.globalMode || 'random';
      // 兼容旧存档：hintEnabled 布尔 → 开启时按首字母（1）处理
      hintCount = (state.hintCount !== undefined) ? (state.hintCount || 0) : (state.hintEnabled ? 1 : 0);
      timerEnabled = state.timerEnabled || false;
      dailyGoal = state.dailyGoal || 50;
      timerDuration = state.timerDuration || 10;
      todayStr = new Date().toISOString().slice(0,10);
      dailyCount = (state.today === todayStr) ? (state.dailyCount || 0) : 0;
      // 兼容旧版：把散落的 wrongBookIds/newWordBookIds 迁移到当前章节归档
      booksStore = state.booksStore || {};
      if(!state.booksStore && (state.wrongBookIds || state.newWordBookIds)){
        booksStore[state.chapter || 1] = { wrongBookIds: state.wrongBookIds||[], newWordBookIds: state.newWordBookIds||[] };
      }

      document.querySelectorAll('.mode-btn').forEach(b=>b.classList.toggle('active', b.dataset.mode === globalMode));
      hintSelect.value = String(hintCount);
      hintSelect.classList.toggle('on', hintCount > 0);
      timerToggle.classList.toggle('active', timerEnabled);
      timerDisplay.style.display = timerEnabled ? 'flex' : 'none';
      updateGoalDisplay();
      updateModeIndicator();

      return switchChapter(state.chapter, false).then(async ()=>{
        correctTotal = state.correctTotal || 0;
        wrongTotal = state.wrongTotal || 0;
        completedCount = state.completedCount || 0;
        currentIndex = state.currentIndex || 0;
        // 如果已登录，从云端合并数据
        if (VocabAuth.isLoggedIn()) {
          // 加载云端设置
          const cloudSettings = await VocabAuth.loadSettings();
          if (cloudSettings) {
            if (cloudSettings.dailyGoal) { dailyGoal = cloudSettings.dailyGoal; updateGoalDisplay(); }
            if (cloudSettings.hintCount !== undefined) { hintCount = cloudSettings.hintCount; hintSelect.value = String(hintCount); hintSelect.classList.toggle('on', hintCount > 0); }
            if (cloudSettings.globalMode) { globalMode = cloudSettings.globalMode; document.querySelectorAll('.mode-btn').forEach(b=>b.classList.toggle('active', b.dataset.mode === globalMode)); updateModeIndicator(); }
            if (cloudSettings.timerEnabled !== undefined) { timerEnabled = cloudSettings.timerEnabled; timerToggle.classList.toggle('active', timerEnabled); timerDisplay.style.display = timerEnabled ? 'flex' : 'none'; }
            if (cloudSettings.timerDuration) timerDuration = cloudSettings.timerDuration;
          }
          // 合并云端章节数据
          const cloudChapters = await VocabAuth.loadAllProgress();
          if (cloudChapters) {
            const curChapterId = state.chapter || 1;
            for (const [chId, cloudData] of Object.entries(cloudChapters)) {
              const localBucket = booksStore[chId] || {};
              // 错题/生词：取并集（新词+旧词都不丢）
              const mergedWrong = [...new Set([...(localBucket.wrongBookIds || []), ...(cloudData.wrongBookIds || [])])];
              const mergedNew = [...new Set([...(localBucket.newWordBookIds || []), ...(cloudData.newWordBookIds || [])])];
              booksStore[chId] = { wrongBookIds: mergedWrong, newWordBookIds: mergedNew };
              // 当前章节：同步进度数据（取更新的版本）
              if (String(chId) === String(curChapterId) && cloudData.updatedAt) {
                const localTime = state.savedAt || '';
                if (cloudData.updatedAt > localTime || !localTime) {
                  correctTotal = cloudData.correctTotal ?? correctTotal;
                  wrongTotal = cloudData.wrongTotal ?? wrongTotal;
                  completedCount = cloudData.completedCount ?? completedCount;
                  currentIndex = cloudData.currentIndex ?? currentIndex;
                  if (cloudData.shuffledIds && cloudData.shuffledIds.length) {
                    const idMap = new Map(currentVocabulary.map(w=>[w.id, w]));
                    const restored = cloudData.shuffledIds.map(id=>idMap.get(id)).filter(Boolean);
                    if (restored.length) { shuffledWords = restored; if (currentIndex >= shuffledWords.length) currentIndex = 0; }
                  }
                }
              }
            }
          }
        }
        loadBooksForChapter(state.chapter || 1);
        if(state.shuffledIds && state.shuffledIds.length){
          const idMap = new Map(currentVocabulary.map(w=>[w.id, w]));
          shuffledWords = state.shuffledIds.map(id=>idMap.get(id)).filter(Boolean);
          if(currentIndex >= shuffledWords.length) currentIndex = 0;
        } else {
          shuffledWords = [...currentVocabulary].sort(()=>Math.random()-0.5);
        }
        updateWrongBookUI(); updateNewWordBookUI(); updateSidebar();
        if(shuffledWords.length > 0) loadNextWord();
        updateStats();
        return true;
      });
    }catch(e){
      console.warn('状态恢复失败', e);
      return Promise.resolve(false);
    }
  }

  function switchChapter(chapterId, reset=true){
    return new Promise(resolve=>{
      const old = document.querySelector('script[data-chapter]');
      if(old) old.remove();
      const script = document.createElement('script');
      script.src = `data-${chapterId}.js`;
      script.setAttribute('data-chapter', chapterId);
      const loadToken = ++chapterLoadToken;
      script.onload = ()=>{
        // 快速连切章节时，只有最新一次加载生效，避免旧章数据覆盖新章
        if(loadToken !== chapterLoadToken) { resolve(); return; }
        if(typeof vocabulary!=='undefined' && vocabulary.length>0){
          currentVocabulary = vocabulary;
          isReviewMode = false;
          // 普通切章：归档上一章错题本后重置本章进度并重新洗牌；
          // loadState 恢复路径传 reset=false，由调用方自行恢复进度。
          if(reset) resetChapterProgress();
          resolve();
        } else { alert('词汇数据为空，请确保data-{章节}.js存在'); resolve(); }
      };
      script.onerror = ()=>{ alert(`加载第${chapterId}章失败, 请检查词汇文件`); resolve(); };
      document.head.appendChild(script);
    });
  }

  function resetChapterProgress(){
    const curChapter = parseInt(chapterSelect.value) || 1;
    loadBooksForChapter(curChapter);
    shuffledWords = [...currentVocabulary].sort(()=>Math.random()-0.5);
    currentIndex = 0; correctTotal = 0; wrongTotal = 0; completedCount = 0;
    updateWrongBookUI(); updateNewWordBookUI(); updateSidebar();
    if(shuffledWords.length>0) loadNextWord();
    updateStats(); saveState();
  }

  function resetAndStart(){
    const curChapter = parseInt(chapterSelect.value) || 1;
    booksStore[curChapter] = { wrongBookIds: [], newWordBookIds: [] };
    isReviewMode = false;
    wrongBook=[]; newWordBook=[];
    shuffledWords = [...currentVocabulary].sort(()=>Math.random()-0.5);
    currentIndex=0; correctTotal=0; wrongTotal=0; completedCount=0;
    updateWrongBookUI(); updateNewWordBookUI(); updateSidebar();
    if(shuffledWords.length>0) loadNextWord();
    updateStats();
    saveState();
  }

  function startTimer(){
    clearInterval(timerInterval);
    if(!timerEnabled) return;
    let remaining = timerDuration;
    timerSeconds.textContent = remaining;
    timerSeconds.classList.toggle('urgent', remaining <= 3);
    timerInterval = setInterval(()=>{
      remaining--;
      timerSeconds.textContent = remaining;
      timerSeconds.classList.toggle('urgent', remaining <= 3);
      if(remaining <= 0){ clearInterval(timerInterval); timerSeconds.classList.remove('urgent'); if(!isAnswered) handleTimeout(); }
    }, 1000);
  }

  function handleTimeout(){
    if(isAnswered) return;
    isAnswered = true;
    wrongTotal++; playWrong();
    resultArea.innerHTML = `<span style="color:#ef4444;">⏰ 时间到！正确单词：<strong>${escapeHTML(currentWord.word)}</strong></span>`;
    if(!wrongBook.some(w=>w.id===currentWord.id)) wrongBook.push(currentWord);
    completedCount++;
    renderSlots();
    if(currentWord.exampleEN){ exampleEN.textContent=`“${currentWord.exampleEN}”`; exampleCN.textContent=currentWord.exampleCN||''; exampleBox.style.display='block'; }
    speakWord(currentWord.word);
    updateWrongBookUI(); updateStats(); incrementDaily(); saveState(); updateSidebar();
  }

  function loadNextWord(){
    if(shuffledWords.length===0) return;
    clearInterval(timerInterval);
    currentIndex = currentIndex % shuffledWords.length;
    currentWord = shuffledWords[currentIndex];
    isAnswered = false;
    resultArea.textContent = ''; exampleBox.style.display = 'none';
    startTime = Date.now();
    if(globalMode==='random') currentMode = Math.random()<0.5?'chinese':'audio';
    else currentMode = globalMode;
    if(currentMode==='chinese') chineseDisplay.textContent = currentWord.meaningCN;
    else { chineseDisplay.textContent = ''; speakWord(currentWord.word); }
    userInput = currentWord.word.split('').map(()=> '');
    hintIdx = new Set();
    if(hintCount > 0 && currentWord.word.length > 0){
      const n = Math.min(hintCount, currentWord.word.length);
      if(hintCount === 1){
        hintIdx.add(0);
        userInput[0] = currentWord.word[0].toLowerCase();
      } else {
        const pool = [...Array(currentWord.word.length).keys()];
        for(let k=0; k<n; k++){
          const r = k + Math.floor(Math.random()*(pool.length-k));
          [pool[k], pool[r]] = [pool[r], pool[k]];
          const idx = pool[k];
          hintIdx.add(idx);
          userInput[idx] = currentWord.word[idx].toLowerCase();
        }
      }
    }
    cursor = findCursor();
    renderSlots();
    if(timerEnabled) startTimer();
    updateStats(); saveState();
  }

  // 找下一个可输入光标位置（跳过已填和提示位）
  function findCursor(){
    if(!currentWord) return 0;
    for(let i=0; i<currentWord.word.length; i++){
      if(!hintIdx.has(i) && !userInput[i]) return i;
    }
    return currentWord.word.length;
  }

  // 切换提示档级时，清除旧提示后重新生成（允许降级）
  function applyHintToCurrentWord(){
    if(isAnswered || !currentWord){ renderSlots(); return; }
    // 清除所有旧提示字母
    for(const idx of hintIdx){ userInput[idx] = ''; }
    hintIdx.clear();
    // 按新档级生成提示
    const n = Math.min(hintCount, currentWord.word.length);
    if(hintCount === 1 && n > 0){
      hintIdx.add(0);
      userInput[0] = currentWord.word[0].toLowerCase();
    } else if(n > 0){
      const pool = [...Array(currentWord.word.length).keys()];
      for(let k=0; k<n; k++){
        const r = k + Math.floor(Math.random()*(pool.length-k));
        [pool[k], pool[r]] = [pool[r], pool[k]];
        hintIdx.add(pool[k]);
        userInput[pool[k]] = currentWord.word[pool[k]].toLowerCase();
      }
    }
    cursor = findCursor();
    renderSlots();
  }

  function renderSlots(){
    const len = currentWord.word.length;
    let html = '';
    for(let i=0; i<len; i++){
      const letter = userInput[i] || '';
      let cls = 'slot';
      if(!isAnswered && hintIdx.has(i)) cls += ' hint';
      if(!isAnswered && i===cursor) cls += ' active-slot';
      if(isAnswered){
        const correct = currentWord.word[i].toLowerCase();
        cls += letter===correct ? ' correct' : ' wrong';
      }
      html += `<div class="${cls}">${escapeHTML(letter)}</div>`;
    }
    letterSlots.innerHTML = html;
  }

  function updateStats(){
    const total = shuffledWords.length;
    progressText.textContent = `${completedCount}/${total}`;
    correctCountEl.textContent = correctTotal; wrongCountEl.textContent = wrongTotal;
    progressFill.style.width = `${total>0?(completedCount/total)*100:0}%`;
  }

  function incrementDaily(){
    dailyCount++;
    if(dailyCount >= dailyGoal){ showReward(); dailyCount = 0; }
    updateGoalDisplay(); saveState();
  }
  function updateGoalDisplay(){
    goalCount.textContent = `${dailyCount}/${dailyGoal}`;
    goalFill.style.width = `${Math.min(100,(dailyCount/dailyGoal)*100)}%`;
  }
  function showReward(){
    const modal = document.createElement('div'); modal.className='modal';
    modal.innerHTML = `<div class="modal-content" style="text-align:center;"><h2>🎉 恭喜！</h2><p>你已完成今日目标 ${dailyGoal} 词！</p><button class="primary" id="closeRewardBtn">太棒了</button></div>`;
    document.body.appendChild(modal);
    document.getElementById('closeRewardBtn').addEventListener('click', ()=>modal.remove());
  }

  function submitAnswer(){
    if(!currentWord || isAnswered) return;
    if(cursor < currentWord.word.length){ resultArea.innerHTML='<span style="color:#f59e0b;">请完成单词再提交</span>'; return; }
    clearInterval(timerInterval);
    isAnswered = true;
    const inputWord = userInput.join('').toLowerCase().replace(/\s/g,' ');
    const correct = inputWord === currentWord.word.toLowerCase();
    if(correct){ correctTotal++; playCorrect(); resultArea.innerHTML='<span style="color:#10b981;">✔️ 正确！</span>'; }
    else {
      wrongTotal++; playWrong();
      resultArea.innerHTML = `<span style="color:#ef4444;">❌ 错误！正确单词：<strong>${escapeHTML(currentWord.word)}</strong></span>`;
      if(!wrongBook.some(w=>w.id===currentWord.id)) wrongBook.push(currentWord);
    }
    completedCount++;
    renderSlots();
    if(currentWord.exampleEN){ exampleEN.textContent=`“${currentWord.exampleEN}”`; exampleCN.textContent=currentWord.exampleCN||''; exampleBox.style.display='block'; }
    speakWord(currentWord.word);
    updateWrongBookUI(); updateStats(); incrementDaily(); saveState(); updateSidebar();
    if(completedCount >= shuffledWords.length) showReport();
  }

  function moveToNextWord(){
    if(!isAnswered) return;
    currentIndex++;
    if(currentIndex >= shuffledWords.length){ shuffledWords = [...currentVocabulary].sort(()=>Math.random()-0.5); currentIndex=0; completedCount=0; }
    loadNextWord();
  }

  function skipWord(){
    if(!currentWord) return;
    currentIndex++;
    if(currentIndex >= shuffledWords.length){ shuffledWords = [...currentVocabulary].sort(()=>Math.random()-0.5); currentIndex=0; completedCount=0; }
    loadNextWord();
  }

  addNewWordBtn.addEventListener('click', ()=>{
    if(!currentWord) return;
    if(!newWordBook.some(w=>w.id===currentWord.id)){ newWordBook.push(currentWord); updateNewWordBookUI(); saveState(); updateSidebar(); }
  });

  function updateWrongBookUI(){
    wrongBookCount.textContent = wrongBook.length;
    wrongList.innerHTML = wrongBook.map(w=>`<div class="word-chip"><span>${escapeHTML(w.word)}</span> ${escapeHTML(w.meaningCN)} <span data-remove-wrong data-id="${w.id}" style="margin-left:4px;cursor:pointer;">✕</span></div>`).join('') || '<span style="color:#94a3b8;">暂无错题</span>';
    document.querySelectorAll('[data-remove-wrong]').forEach(el=>el.addEventListener('click', e=>{ e.stopPropagation(); wrongBook = wrongBook.filter(w=>w.id!==parseInt(el.dataset.id)); updateWrongBookUI(); saveState(); updateSidebar(); }));
    document.querySelectorAll('#wrongList .word-chip').forEach(chip=>chip.addEventListener('click', function(){ speakWord(this.querySelector('span').textContent); }));
  }
  function updateNewWordBookUI(){
    newWordCount.textContent = newWordBook.length;
    newWordList.innerHTML = newWordBook.map(w=>`<div class="word-chip new-word"><span>${escapeHTML(w.word)}</span> ${escapeHTML(w.meaningCN)} <span data-remove-new data-id="${w.id}" style="margin-left:4px;cursor:pointer;">✕</span></div>`).join('') || '<span style="color:#94a3b8;">暂无生词</span>';
    document.querySelectorAll('[data-remove-new]').forEach(el=>el.addEventListener('click', e=>{ e.stopPropagation(); newWordBook = newWordBook.filter(w=>w.id!==parseInt(el.dataset.id)); updateNewWordBookUI(); saveState(); updateSidebar(); }));
    document.querySelectorAll('#newWordList .word-chip').forEach(chip=>chip.addEventListener('click', function(){ speakWord(this.querySelector('span').textContent); }));
  }

  document.getElementById('reviewBookBtn').addEventListener('click', ()=>{
    const all = [...wrongBook, ...newWordBook.filter(w=>!wrongBook.some(wb=>wb.id===w.id))];
    if(all.length===0){ alert('错题本和生词本均为空'); return; }
    isReviewMode = true;
    currentVocabulary = all; shuffledWords = [...all].sort(()=>Math.random()-0.5);
    currentIndex=0; correctTotal=0; wrongTotal=0; completedCount=0;
    updateStats(); loadNextWord(); alert('已进入错题+生词复习模式');
  });

  function showReport(){
    const total = shuffledWords.length;
    const accuracy = total ? Math.round((correctTotal/total)*100) : 0;
    const weakWords = wrongBook.map(w=>w.word).join(', ') || '无';
    const modal = document.createElement('div'); modal.className='modal';
    modal.innerHTML = `<div class="modal-content"><h2>📊 学习报告</h2><p>总词数：<strong>${total}</strong></p><p>正确率：<strong>${accuracy}%</strong></p><p>薄弱词：<strong>${weakWords}</strong></p><button id="closeReportBtn" class="primary" style="margin-top:10px;">关闭</button></div>`;
    document.body.appendChild(modal);
    document.getElementById('closeReportBtn').addEventListener('click', ()=>modal.remove());
  }

  setGoalBtn.addEventListener('click', ()=>{
    const newGoal = prompt('设置每日词汇目标数量：', dailyGoal);
    if(newGoal && !isNaN(newGoal) && newGoal>0){ dailyGoal = parseInt(newGoal); updateGoalDisplay(); saveState(); }
  });

  document.getElementById('darkModeToggle').addEventListener('click', ()=>{
    document.body.classList.toggle('dark');
    localStorage.setItem('vocab:dark-mode', document.body.classList.contains('dark'));
  });
  if(localStorage.getItem('vocab:dark-mode')==='true') document.body.classList.add('dark');

  // ✅ 修复连字符和空格输入：允许字母、连字符和空格
  document.addEventListener('keydown', e=>{
    if(!currentWord) return;
    const tag = e.target.tagName;
    if(tag==='INPUT' || tag==='TEXTAREA' || tag==='SELECT') return;
    if(e.key==='Enter'){ if(tag==='BUTTON') return; e.preventDefault(); if(!isAnswered) submitAnswer(); else moveToNextWord(); return; }
    if(isAnswered) return;
    if(/^[a-zA-Z\- ]$/.test(e.key)){
      e.preventDefault();
      if(cursor < currentWord.word.length){
        userInput[cursor] = e.key.toLowerCase();
        cursor = findCursor();
        renderSlots();
      }
    }
    else if(e.key==='Backspace'){
      e.preventDefault();
      for(let i=cursor-1; i>=0; i--){
        if(!hintIdx.has(i) && userInput[i]){
          userInput[i] = '';
          cursor = i;
          renderSlots();
          break;
        }
      }
    }
  });

  nextBtn.addEventListener('click', ()=>{ if(!isAnswered) submitAnswer(); else moveToNextWord(); });
  skipBtn.addEventListener('click', skipWord);
  restartBtn.addEventListener('click', ()=>{ resetAndStart(); });
  repeatBtn.addEventListener('click', ()=>{ if(currentWord) speakWord(currentWord.word); });
  document.getElementById('clearWrongBtn').addEventListener('click', ()=>{ wrongBook=[]; updateWrongBookUI(); saveState(); updateSidebar(); });
  document.getElementById('clearNewWordsBtn').addEventListener('click', ()=>{ newWordBook=[]; updateNewWordBookUI(); saveState(); updateSidebar(); });

  document.getElementById('wrongBookToggle').addEventListener('click', function(){
    const list = document.getElementById('wrongList');
    const hidden = list.style.display === 'none';
    list.style.display = hidden ? 'flex' : 'none';
    this.querySelector('span').textContent = hidden ? '▼' : '▶';
  });
  document.getElementById('newWordBookToggle').addEventListener('click', function(){
    const list = document.getElementById('newWordList');
    const hidden = list.style.display === 'none';
    list.style.display = hidden ? 'flex' : 'none';
    this.querySelector('span').textContent = hidden ? '▼' : '▶';
  });

  // 侧边栏
  function openSidebar() {
    sidebar.classList.add('open');
    sidebarOverlay.classList.add('active');
    updateSidebar();
  }
  function closeSidebar() {
    sidebar.classList.remove('open');
    sidebarOverlay.classList.remove('active');
  }
  sidebarToggleBtn.addEventListener('click', ()=>{
    if (sidebar.classList.contains('open')) closeSidebar();
    else openSidebar();
  });
  sidebarOverlay.addEventListener('click', closeSidebar);
  closeSidebarBtn.addEventListener('click', closeSidebar);
  sidebarSearch.addEventListener('input', updateSidebar);

  function updateSidebar(){
    if(!currentVocabulary.length || !sidebar.classList.contains('open')) return;
    const query = sidebarSearch.value.toLowerCase();
    const filtered = currentVocabulary.filter(w => w.word.toLowerCase().includes(query) || w.meaningCN.includes(query));
    sidebarList.innerHTML = filtered.map(w => {
      let statusIcon = '';
      if(wrongBook.some(wb=>wb.id===w.id)) statusIcon = '<span class="status-icon" style="color:var(--wrong);">✗</span>';
      else if(newWordBook.some(nw=>nw.id===w.id)) statusIcon = '<span class="status-icon" style="color:#f59e0b;">★</span>';
      else statusIcon = '<span class="status-icon" style="color:var(--correct);">○</span>';
      return `<div class="sidebar-item" data-id="${w.id}">
        <span class="word-text">${escapeHTML(w.word)}</span>
        <span style="color:var(--text-secondary);font-size:0.8rem;">${escapeHTML(w.meaningCN)}</span>
        ${statusIcon}
      </div>`;
    }).join('');
    document.querySelectorAll('.sidebar-item').forEach(item => {
      item.addEventListener('click', function(){
        const wordId = parseInt(this.dataset.id);
        jumpToWord(wordId);
      });
    });
  }

  function jumpToWord(wordId){
    const targetWord = currentVocabulary.find(w => w.id === wordId);
    if(!targetWord) return;
    let idx = shuffledWords.findIndex(w => w.id === wordId);
    if(idx === -1) shuffledWords[currentIndex] = targetWord;
    else [shuffledWords[currentIndex], shuffledWords[idx]] = [shuffledWords[idx], shuffledWords[currentIndex]];
    currentWord = shuffledWords[currentIndex];
    loadNextWord();
    closeSidebar();
  }

  // 初始化：先尝试恢复状态，若无则加载第一章
  loadState().then((restored) => {
    if(!restored) {
      chapterSelect.value = 1;
      switchChapter(1).then(() => resetAndStart());
    }
    updateModeIndicator();
    updateGoalDisplay();
  });
})();
</script>
</body>
</html>

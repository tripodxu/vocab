<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>真经刷词 · 后台管理</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#f7f5f1" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // 首屏主题：在样式生效前定好 data-theme，暗色用户不再闪一帧亮色（FOUC）。
      // 解析逻辑必须与 ui.js 的 theme.resolved() / theme.apply() 一致，改那边要同步改这里。
      (function () {
        try {
          var raw = localStorage.getItem("vocab:theme");
          var mode = raw === "light" || raw === "dark" ? raw : "system";
          var dark =
            mode === "dark" ||
            (mode === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.theme = dark ? "dark" : "light";
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", dark ? "#101218" : "#f7f5f1");
        } catch (e) {}
      })();
    </script>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="modulepreload" href="dist/admin.DQAVS7IN.js" />
    <link rel="stylesheet" href="dist/tokens.AXUX2QTD.css" />
    <link rel="stylesheet" href="dist/ui.G7EJTXZV.css" />
    <link rel="stylesheet" href="dist/admin.MRYAY563.css" />
  </head>
  <body>
    <!-- 键盘用户第一站：跳过重复顶栏直达主内容（视觉隐藏，聚焦时滑出） -->
    <a class="skip-link" href="#main">跳到主内容</a>
    <div class="app-bg" aria-hidden="true"></div>


    <div class="page admin-page">
      <header class="topbar">
        <div class="topbar-inner">
          <div class="brand">
            <span class="brand-mark" aria-hidden="true"><svg class="icon" viewBox="0 0 24 24"><use href="#i-sliders"></use></svg></span>
            <span class="brand-text">
              <b>真经刷词 · 后台</b>
              <small>仅站点管理者使用</small>
            </span>
          </div>
          <button id="logoutAdmin" class="btn btn-sm btn-ghost" type="button" title="清除本机保存的管理令牌" hidden>清除令牌</button>
        </div>
      </header>

      <main class="card stage" id="main" tabindex="-1">
        <!-- 登录门：令牌只存 sessionStorage，关闭浏览器即清除 -->
        <section id="loginGate" class="admin-gate">
          <h1>后台管理</h1>
          <p class="small muted">输入管理令牌（ADMIN_TOKEN）。令牌只保存在本标签页，关闭浏览器即清除。</p>
          <form id="gateForm" class="stack-3">
            <div class="field">
              <label for="adminToken">管理令牌</label>
              <input class="input" id="adminToken" type="password" autocomplete="off" placeholder="ADMIN_TOKEN" required />
            </div>
            <p id="gateError" class="small" style="color: var(--bad); min-height: 1.2em; margin: 0"></p>
            <button class="btn btn-primary btn-block" type="submit">进入后台</button>
          </form>
        </section>

        <!-- 控制台 -->
        <section id="console" hidden>
          <nav class="seg admin-tabs" role="tablist" aria-label="后台分区">
            <button type="button" role="tab" data-tab="overview" aria-selected="true">总览</button>
            <button type="button" role="tab" data-tab="reports" aria-selected="false">报错</button>
            <button type="button" role="tab" data-tab="users" aria-selected="false">用户</button>
          </nav>
          <section id="tab-overview" class="admin-panel" role="tabpanel"></section>
          <section id="tab-reports" class="admin-panel" role="tabpanel" hidden></section>
          <section id="tab-users" class="admin-panel" role="tabpanel" hidden></section>
        </section>
      </main>
    </div>

    <script type="module" src="dist/admin.DQAVS7IN.js"></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>真经刷词 · 学习报告</title>
    <meta name="description" content="学习控制台：今日目标与连续天数、近 7 天活跃、22 章进度矩阵、易错词总览与分模式成绩。" />
    <meta name="theme-color" content="#f7f5f1" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // 首屏主题：在样式生效前定好 data-theme，暗色用户不再闪一帧亮色（FOUC）。
      // 解析逻辑必须与 ui.js 的 theme.resolved() / theme.apply() 一致，改那边要同步改这里。
      (function () {
        try {
          var raw = localStorage.getItem("vocab:theme");
          var mode = raw === "light" || raw === "dark" ? raw : "system";
          var dark =
            mode === "dark" ||
            (mode === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.theme = dark ? "dark" : "light";
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", dark ? "#101218" : "#f7f5f1");
        } catch (e) {}
      })();
    </script>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="modulepreload" href="dist/报告.KHLHCC4B.js" />
    <link rel="stylesheet" href="dist/tokens.AXUX2QTD.css" />
    <link rel="stylesheet" href="dist/ui.G7EJTXZV.css" />
    <link rel="stylesheet" href="dist/app.4IQK7T54.css" />
    <link rel="stylesheet" href="dist/报告.IDIPVWZX.css" />
  </head>
  <body>
    <!-- 键盘用户第一站：跳过重复顶栏直达主内容（视觉隐藏，聚焦时滑出） -->
    <a class="skip-link" href="#reportRoot">跳到主内容</a>
    <div class="app-bg" aria-hidden="true"></div>


    <div class="page report-page">
      <header class="topbar">
        <div class="topbar-inner">
          <div class="brand">
            <span class="brand-mark" aria-hidden="true"><svg class="icon" viewBox="0 0 24 24"><use href="#i-chart"></use></svg></span>
            <span class="brand-text">
              <b>学习报告</b>
              <small id="reportSub">加载中…</small>
            </span>
          </div>
          <a class="btn btn-icon btn-ghost" href="index.html" title="去刷词练习" aria-label="去刷词练习"><svg class="icon" viewBox="0 0 24 24"><use href="#i-book-open"></use></svg></a>
        </div>
      </header>

      <p id="offlineHint" class="small muted report-hint" hidden>
        登录状态暂时无法校验，以下先展示本机数据；网络恢复后自动刷新。
      </p>

      <main id="reportRoot" tabindex="-1" class="stack-3" aria-live="polite">
        <p class="empty">正在生成本地报告…</p>
      </main>
    </div>

    <script type="module" src="dist/报告.KHLHCC4B.js"></script>
  </body>
</html>
